<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shift Floor</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E7A63">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shift Floor">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#F2F5F0;
    --surface:#FFFFFF;
    --surface-2:#E8EDE3;
    --ink:#151C18;
    --muted:#5D6B61;
    --line:#D7DED2;
    --accent:#0E7A63;
    --accent-ink:#FFFFFF;
    --accent-soft:#DCEEE7;
    --warn:#B8721A;
    --warn-soft:#F6E5CC;
    --bad:#B3402A;
    --bad-soft:#F6DAD3;
    --good:#1C7A50;
    --good-soft:#DCEFE1;
    --shadow: 0 1px 2px rgba(21,28,24,.06), 0 6px 16px rgba(21,28,24,.07);
    --radius: 14px;
    --font-display:'Barlow Semi Condensed','Arial Narrow',sans-serif;
    --font-body:'Public Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1613;
      --surface:#182620;
      --surface-2:#1E2E27;
      --ink:#E8F0EA;
      --muted:#94AB9E;
      --line:#293A31;
      --accent:#41BF9C;
      --accent-ink:#0A1512;
      --accent-soft:#1C3A31;
      --warn:#E1A45B;
      --warn-soft:#3B2C17;
      --bad:#E17E6E;
      --bad-soft:#3B211A;
      --good:#4FCB8C;
      --good-soft:#1A3A28;
      --shadow: 0 1px 2px rgba(0,0,0,.45), 0 10px 26px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1613;
    --surface:#182620;
    --surface-2:#1E2E27;
    --ink:#E8F0EA;
    --muted:#94AB9E;
    --line:#293A31;
    --accent:#41BF9C;
    --accent-ink:#0A1512;
    --accent-soft:#1C3A31;
    --warn:#E1A45B;
    --warn-soft:#3B2C17;
    --bad:#E17E6E;
    --bad-soft:#3B211A;
    --good:#4FCB8C;
    --good-soft:#1A3A28;
    --shadow: 0 1px 2px rgba(0,0,0,.45), 0 10px 26px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
  h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0; letter-spacing:.2px;}
  .num{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  button{font-family:var(--font-body); cursor:pointer;}
  input, select{font-family:var(--font-body);}
  a{color:var(--accent);}
  :focus-visible{outline:3px solid var(--accent); outline-offset:2px;}

  .shell{max-width:1100px;margin:0 auto;padding:18px 18px 48px;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:10px 4px 18px;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:18px;
  }
  .brand-logo{height:34px;width:auto;display:block;}
  .brand-name{font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:.3px;}
  .status-pill{
    font-size:12px; padding:4px 10px; border-radius:999px; background:var(--surface-2); color:var(--muted);
    display:inline-flex; align-items:center; gap:6px; font-weight:600;
  }
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--good);}
  .status-dot.warn{background:var(--warn);}
  .status-dot.bad{background:var(--bad);}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  /* ---- Kiosk / worker flow ---- */
  .kiosk{
    min-height:calc(100vh - 90px);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .kiosk-card{
    width:100%; max-width:460px;
    padding:36px 32px 32px;
    text-align:center;
  }
  .kiosk-eyebrow{
    font-size:13px; font-weight:600; color:var(--accent); text-transform:uppercase; letter-spacing:1.2px; margin-bottom:10px;
  }
  .kiosk-title{font-size:26px; line-height:1.2; margin-bottom:8px;}
  .kiosk-sub{color:var(--muted); font-size:15px; margin-bottom:24px; line-height:1.45;}
  .connect-spinner{
    width:34px; height:34px; margin:6px auto 22px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--accent);
    animation: connectSpin .8s linear infinite;
  }
  @keyframes connectSpin{ to{ transform:rotate(360deg); } }
  .kiosk-body{display:flex; flex-direction:column; gap:14px;}
  select.big, input.big{
    width:100%; font-size:19px; padding:16px 14px; border-radius:12px; border:1.5px solid var(--line);
    background:var(--surface); color:var(--ink);
  }
  input.big{text-align:center; font-family:var(--font-mono); font-weight:600;}
  input.big[type="text"]{font-family:var(--font-body); font-weight:400; text-align:left;}
  .btn{
    border:none; border-radius:12px; padding:16px 20px; font-size:17px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  }
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-primary:disabled{opacity:.45; cursor:not-allowed;}
  .btn-ghost{background:var(--surface-2); color:var(--ink);}
  .btn-danger{background:var(--bad-soft); color:var(--bad);}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{flex:1;}
  .link-btn{
    background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline;
    padding:8px; margin-top:6px;
  }
  .task-name-tag{
    display:inline-block; background:var(--accent-soft); color:var(--accent); font-weight:700;
    padding:4px 12px; border-radius:999px; font-size:14px; margin-bottom:2px;
  }
  .confirm-summary{
    text-align:left; background:var(--surface-2); border-radius:12px; padding:14px 16px; font-size:15px;
    display:flex; flex-direction:column; gap:6px; margin-bottom:6px;
  }
  .confirm-summary div{display:flex; justify-content:space-between; gap:10px;}
  .confirm-summary b{font-family:var(--font-mono);}

  /* ---- Notices / messages ---- */
  .banner{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:14px 18px; margin-bottom:12px; background:var(--accent-soft); border:1px solid var(--line);
  }
  .banner span{line-height:1.4;}
  .banner button{flex-shrink:0;}

  /* ---- Manager dashboard ---- */
  .week-banner{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
    padding:16px 20px; margin-bottom:18px;
  }
  .week-banner h2{font-size:22px;}
  .week-banner .sub{color:var(--muted); font-size:14px; margin-top:2px;}
  .toolbar{display:flex; gap:10px; flex-wrap:wrap;}
  .toolbar button{
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:10px 16px; border-radius:10px; font-weight:600; font-size:14px;
  }
  .toolbar button.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent;}

  .overall-row{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px;
  }
  .stat-tile{padding:16px 18px;}
  .stat-tile .label{font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); font-weight:700;}
  .stat-tile .value{font-family:var(--font-mono); font-size:28px; font-weight:600; margin-top:4px;}
  .stat-tile .value.good{color:var(--good);}
  .stat-tile .value.warn{color:var(--warn);}
  .stat-tile .value.bad{color:var(--bad);}

  .section-title{
    font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); font-weight:700;
    margin:26px 4px 12px;
  }
  .task-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px;}
  .task-card{padding:18px 20px;}
  .task-card[draggable="true"]{cursor:grab;}
  .task-card-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .task-card-head h3{font-size:19px;}
  .badge{
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap;
  }
  .badge.good{background:var(--good-soft); color:var(--good);}
  .badge.warn{background:var(--warn-soft); color:var(--warn);}
  .badge.bad{background:var(--bad-soft); color:var(--bad);}
  .badge.idle{background:var(--surface-2); color:var(--muted);}
  .task-metrics{display:flex; gap:18px; margin:14px 0 10px;}
  .task-metric .n{font-family:var(--font-mono); font-size:22px; font-weight:600;}
  .task-metric .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px;}
  .task-recent{
    font-size:13px; color:var(--muted); border-top:1px dashed var(--line); padding-top:10px; margin-top:4px;
  }
  .task-recent b{color:var(--ink); font-family:var(--font-mono);}

  .slot-empty{
    border:2px dashed var(--line); border-radius:var(--radius); padding:24px 16px; text-align:center; color:var(--muted); font-size:14px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:150px;
  }

  table.data-table{width:100%; border-collapse:collapse; font-size:14px;}
  table.data-table th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted);
    padding:8px 10px; border-bottom:1px solid var(--line);
  }
  table.data-table td{padding:10px; border-bottom:1px solid var(--line);}
  table.data-table td.num, table.data-table th.num{text-align:right; font-family:var(--font-mono);}
  .table-wrap{overflow-x:auto;}

  .panel{padding:22px 24px; margin-top:18px;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px; flex-wrap:wrap;}
  .row-form{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px;}
  .row-form input, .row-form select{
    padding:10px 12px; border-radius:9px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); font-size:15px;
  }
  .list-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 4px; border-bottom:1px solid var(--line);
  }
  .list-row:last-child{border-bottom:none;}
  .list-row .name{font-weight:600;}
  .list-row .actions{display:flex; gap:8px; flex-wrap:wrap;}
  .chip-btn{
    border:1px solid var(--line); background:var(--surface-2); border-radius:8px; padding:6px 11px; font-size:12.5px; font-weight:600; color:var(--ink);
  }
  .chip-btn.danger{color:var(--bad); border-color:var(--bad-soft);}
  .chip-btn.chip-active{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
  .inactive-tag{color:var(--muted); font-size:12px; font-style:italic;}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,15,12,.45); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:20;
  }
  .modal{width:100%; max-width:440px; padding:26px 26px 22px; max-height:88vh; overflow-y:auto;}
  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
  .field label{font-size:13px; font-weight:600; color:var(--muted);}

  .footer-note{
    text-align:center; color:var(--muted); font-size:12.5px; margin-top:30px; display:flex; flex-direction:column; gap:6px; align-items:center;
  }
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg);
    padding:12px 20px; border-radius:10px; font-size:14px; font-weight:600; box-shadow:var(--shadow); z-index:40;
    max-width:90vw; text-align:center;
  }
  .input-error{ border-color:var(--bad) !important; background:var(--bad-soft) !important; }
  .list-row[draggable="true"]{ cursor:grab; }
  @media (max-width:640px){
    .task-grid{grid-template-columns:1fr;}
    .overall-row{grid-template-columns:repeat(2,1fr);}
  }

  /* ---- Stand-up meeting overlay ---- */
  .standup-overlay{
    position:fixed; inset:0; z-index:9999; background:#4FC3F7; color:#08222c;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    text-align:center; padding:24px; overflow:hidden;
  }
  .standup-overlay h2{color:#08222c; font-size:clamp(26px,6vw,50px);}
  .standup-timer{
    font-size:clamp(64px,20vw,170px); font-weight:700; color:#08222c; line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .standup-svg{position:absolute; opacity:.4; pointer-events:none;}
  @keyframes standupBlink{ 0%,49%{ background:#4FC3F7; } 50%,100%{ background:#FFFFFF; } }
  .standup-overlay.blinking{ animation: standupBlink 1s steps(1,end) 5; }
</style>
</head>

<script type="module">
  // ---- Firebase bridge: exposes window.ShiftFloorDB {subscribe(cb), save(stateObj)} ----
  // and window.ShiftFloorDBReady (a Promise) which the main app script awaits before init().
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { initializeFirestore, persistentLocalCache, getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  window.ShiftFloorDBReady = new Promise(function(resolve){
    try {
      const cfg = window.FIREBASE_CONFIG;
      if (!cfg || !cfg.apiKey || cfg.apiKey === "YOUR_API_KEY") {
        console.warn("Shift Floor: firebase-config.js is not filled in yet — running offline (no shared sync).");
        window.ShiftFloorDB = null;
        resolve(null);
        return;
      }
      const app = initializeApp(cfg);
      let db;
      try {
        // Enable offline persistent local cache so a tablet that briefly loses
        // connectivity (or gets reloaded after being backgrounded) can still read
        // the true last-known state instantly from IndexedDB instead of starting
        // from a blank default — see stateConfirmed handling in the main script.
        db = initializeFirestore(app, { localCache: persistentLocalCache() });
      } catch(e){
        console.warn("Shift Floor: persistent local cache unavailable, falling back to in-memory Firestore.", e);
        db = getFirestore(app);
      }
      const stateRef = doc(db, "shiftfloor", "state");

      window.ShiftFloorDB = {
        // cb(stateObjOrNull) — called once with current data (or null if no doc yet exists),
        // then again on every remote change.
        subscribe: function(cb){
          return onSnapshot(stateRef, function(snap){
            if (!snap.exists()) { cb(null); return; }
            const data = snap.data();
            try {
              cb(data && data.state ? JSON.parse(data.state) : data);
            } catch(e){
              console.error("Shift Floor: failed to parse remote state", e);
              cb(null);
            }
          }, function(err){
            console.error("Shift Floor: onSnapshot error", err);
          });
        },
        // save(stateObj) -> Promise
        save: function(stateObj){
          return setDoc(stateRef, { state: JSON.stringify(stateObj), updatedAt: Date.now() });
        }
      };
      resolve(window.ShiftFloorDB);
    } catch(e){
      console.error("Shift Floor: Firebase init failed", e);
      window.ShiftFloorDB = null;
      resolve(null);
    }
  });
</script>

  /* ---------------- utilities ---------------- */
  function uid(prefix){
    return (prefix||"id") + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }
  function slugify(name){
    return "t-" + name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
  }
  function escapeHtml(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function clamp0(n){ n = Math.floor(Number(n)); return isNaN(n) || n < 0 ? 0 : n; }
  // Like clamp0 but keeps a negative value — used for worker self-service
  // correction entries (Fix 2), where "-1" means "subtract one from the running total".
  function toSignedInt(n){ n = Math.trunc(Number(n)); return isNaN(n) ? 0 : n; }
  function pad2(n){ return n < 10 ? "0"+n : ""+n; }
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const DOWS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  // Date-only ("YYYY-MM-DD") helpers used for entryDate (the day an entry is attributed
  // to) as distinct from ts (the moment it was actually submitted) — see Fix 3.
  function dateOnlyStr(d){
    const x = new Date(d);
    return x.getFullYear()+"-"+pad2(x.getMonth()+1)+"-"+pad2(x.getDate());
  }
  function todayDateOnly(){ return dateOnlyStr(new Date()); }
  // Parses either a date-only string ("YYYY-MM-DD", interpreted as a LOCAL calendar day
  // so it can't shift to the adjacent day under `new Date(str)`'s UTC parsing) or any
  // other date-ish value (ISO timestamp, Date, etc.) via the normal Date constructor.
  function parseDateBasis(d){
    if (typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d)) {
      const parts = d.split("-");
      return new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    }
    return new Date(d);
  }

  function weekStartFor(d){
    const x = parseDateBasis(d);
    x.setHours(0,0,0,0);
    const day = x.getDay();
    const diff = (day - 6 + 7) % 7;
    x.setDate(x.getDate() - diff);
    return x;
  }
  function weekKeyOf(d){
    const s = weekStartFor(d);
    return s.getFullYear()+"-"+pad2(s.getMonth()+1)+"-"+pad2(s.getDate());
  }
  function weekEndFor(startDate){
    const e = new Date(startDate);
    e.setDate(e.getDate()+6);
    e.setHours(23,59,59,999);
    return e;
  }
  function fmtDateShort(d){
    return DOWS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()];
  }
  function fmtRange(start){
    const end = weekEndFor(start);
    const year = end.getFullYear();
    return fmtDateShort(start)+" – "+fmtDateShort(end)+" "+year;
  }
  function fmtRelTime(ts){
    const diffMs = Date.now() - new Date(ts).getTime();
    const m = Math.round(diffMs/60000);
    if (m < 1) return "just now";
    if (m < 60) return m + (m===1?" min ago":" mins ago");
    const h = Math.round(m/60);
    if (h < 24) return h + (h===1?" hour ago":" hours ago");
    const d = Math.round(h/24);
    return d + (d===1?" day ago":" days ago");
  }
  function fmtPct(n){ return n==null ? "—" : n.toFixed(1)+"%"; }
  function monthKeyOf(d){ const x = parseDateBasis(d); return x.getFullYear()+"-"+pad2(x.getMonth()+1); }
  function monthStartFor(d){ const x = parseDateBasis(d); return new Date(x.getFullYear(), x.getMonth(), 1); }
  function monthEndFor(d){ const x = parseDateBasis(d); return new Date(x.getFullYear(), x.getMonth()+1, 0, 23,59,59,999); }
  function fmtMonthLabel(d){ return MONTHS[d.getMonth()]+" "+d.getFullYear(); }

  const TEST_YIELD_NAMES = ["7000-03+01 Main board TEST","7010-03+01 Power board TEST","7020-03+01 Camera board TEST","4625 SAT Modem Board Test","4000-12 CPU Board Test"];
  const COMBO_SEED_TAG = "v1-combos-1";
  const STANDUP_SEED_TAG = "v1-standup-1";
  const DEFAULT_STANDUP = { enabled:true, days:[1,2,3,4,5], hour:11, minute:0 };

  function buildDefaultState(){
    function mkTask(name, id){
      return { id:id, name:name, active:true, aliases:[], partsPerUnit: TOUCHUP_PARTS[name.trim().toLowerCase()]||null };
    }
    return {
      managers: [
        { id:"mark", name:"Mark", pin:"1234" },
        { id:"daniel", name:"Daniel Tucker", pin:"1234" }
      ],
      tasks: SMT_TOP_TASK_NAMES.map(function(name,i){ return mkTask(name, slugify(name)+"-smt"+i); })
        .concat(DEFAULT_TASK_NAMES.map(function(name,i){ return mkTask(name, slugify(name)+"-"+i); })),
      workers: DEFAULT_WORKER_NAMES.map(function(name,i){ return { id: "w-"+slugify(name).slice(2)+"-"+i, name:name, active:true }; }),
      entries: [],
      pendingRequests: [],
      workerMessages: [],
      managerNotices: [],
      notices: [],
      assignments: [],
      combos: [],
      headlineTaskId: null,
      serialTaskId: null,
      serials: [],
      serialFormat: Object.assign({}, DEFAULT_SERIAL_FORMAT),
      reassignUntil: null,
      seedTag: null,
      workerSeedTag: null,
      smtSeedTag: SMT_SEED_TAG,
      comboSeedTag: null,
      ppuSeedTag: null,
      standup: Object.assign({}, DEFAULT_STANDUP),
      standupSeedTag: STANDUP_SEED_TAG
    };
  }

  /* ---------------- state ---------------- */
  let STATE = null;
  let dbApi = null;
  let saveStatus = "idle";
  // Becomes true only once we truly know the real state — either Firestore confirmed
  // real data, or Firestore confirmed the document genuinely doesn't exist yet (brand
  // new setup). Until then, render() must show a "connecting" screen, never the
  // default/blank dashboard, so a stray persist() can never overwrite real data with
  // defaults. See init()/render() below.
  let stateConfirmed = false;
  let connectFailed = false;
  let ui = { screen: null };
  let toastMsg = null, toastTimer = null;
  let standupOverlayState = null; // { phase:'countdown'|'blinking'|'holding', occTs:Number, secondsLeft:Number }
  let standupClockTimer = null;

  function loadUi(){
    try {
      const raw = sessionStorage.getItem("td_ui");

    } catch(e){}

  }
  function setUi(patch){

  }
  function getDeviceMode(){ try { return localStorage.getItem("td_deviceMode"); } catch(e){ return null; } }
  function setDeviceMode(m){ try { localStorage.setItem("td_deviceMode", m); } catch(e){} }
  function getAssignedWorkerId(){ try { return localStorage.getItem("td_assignedWorkerId"); } catch(e){ return null; } }
  function setAssignedWorkerId(id){
    try { if (id) localStorage.setItem("td_assignedWorkerId", id); else localStorage.removeItem("td_assignedWorkerId"); } catch(e){}
  }
  function getMgrIdentity(){ try { return sessionStorage.getItem("td_mgrIdentity"); } catch(e){ return null; } }
  function setMgrIdentity(id){
    try { if (id) sessionStorage.setItem("td_mgrIdentity", id); else sessionStorage.removeItem("td_mgrIdentity"); } catch(e){}
  }
  function mgrKey(base){ return base + "_" + (getMgrIdentity() || "guest"); }
  function getPriorityPins(){
    try { const raw = localStorage.getItem(mgrKey("td_priorityPins")); return raw ? JSON.parse(raw) : [null,null,null,null]; } catch(e){ return [null,null,null,null]; }
  }
  function setPriorityPins(arr){ try { localStorage.setItem(mgrKey("td_priorityPins"), JSON.stringify(arr)); } catch(e){} }
  function isPriorityCollapsed(){ try { return localStorage.getItem(mgrKey("td_priorityCollapsed"))==="1"; } catch(e){ return false; } }
  function setPriorityCollapsed(v){ try { localStorage.setItem(mgrKey("td_priorityCollapsed"), v?"1":"0"); } catch(e){} }
  function isSerialsCollapsed(){ try { return localStorage.getItem(mgrKey("td_serialsCollapsed"))==="1"; } catch(e){ return false; } }
  function setSerialsCollapsed(v){ try { localStorage.setItem(mgrKey("td_serialsCollapsed"), v?"1":"0"); } catch(e){} }
  function isYieldCollapsed(){ try { return localStorage.getItem(mgrKey("td_yieldCollapsed"))==="1"; } catch(e){ return false; } }
  function setYieldCollapsed(v){ try { localStorage.setItem(mgrKey("td_yieldCollapsed"), v?"1":"0"); } catch(e){} }
  function isReassignOpen(){ return !!(STATE && STATE.reassignUntil && new Date(STATE.reassignUntil).getTime() > Date.now()); }
  function ackGet(key){ try { return JSON.parse(localStorage.getItem(key)||"[]"); } catch(e){ return []; } }
  function ackAdd(key,id){
    const arr = ackGet(key);
    if (arr.indexOf(id)===-1){ arr.push(id); try{ localStorage.setItem(key, JSON.stringify(arr)); }catch(e){} }
  }
  function getStandupAckedAt(){
    try { const v = localStorage.getItem("td_standupAckedAt"); return v ? Number(v) : 0; } catch(e){ return 0; }
  }
  function setStandupAckedAt(ts){
    try { localStorage.setItem("td_standupAckedAt", String(ts)); } catch(e){}
  }

  function showToast(msg){
    if (!msg) return;
    toastMsg = msg;
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastMsg = null; render(); }, 3200);
  }

  /* ---------------- migration ---------------- */
  function migrateState(){
    let changed = false;
    if (!STATE.tasks) { STATE.tasks = []; changed = true; }
    STATE.tasks.forEach(function(t){
      if (!t.aliases) { t.aliases = []; changed = true; }
      if (typeof t.active !== "boolean") { t.active = true; changed = true; }
    });
    if (!STATE.workers) { STATE.workers = []; changed = true; }
    if (!STATE.entries) { STATE.entries = []; changed = true; }
    STATE.entries.forEach(function(e){
      // Fix 3 (backdating): every entry needs a date-only entryDate it's attributed to,
      // separate from ts (the real submission moment). Backfill it from ts for any
      // entry created before this feature existed.
      if (!e.entryDate) { e.entryDate = dateOnlyStr(e.ts || Date.now()); changed = true; }
    });
    if (!STATE.pendingRequests) { STATE.pendingRequests = []; changed = true; }
    if (!STATE.workerMessages) { STATE.workerMessages = []; changed = true; }
    if (!STATE.notices) { STATE.notices = []; changed = true; }
    if (!STATE.assignments) { STATE.assignments = []; changed = true; }
    if (!STATE.managers || !STATE.managers.length) {
      const legacyPin = STATE.pin || "1234";
      STATE.managers = [
        { id:"mark", name:"Mark", pin: legacyPin },
        { id:"daniel", name:"Daniel Tucker", pin:"1234" }
      ];
      changed = true;
    }
    if (STATE.pin !== undefined) { delete STATE.pin; changed = true; }
    if (STATE.priorityTaskIds !== undefined) { delete STATE.priorityTaskIds; changed = true; }
    if (!STATE.managerNotices) { STATE.managerNotices = []; changed = true; }
    if (STATE.reassignUntil === undefined) { STATE.reassignUntil = null; changed = true; }
    if (!STATE.combos) { STATE.combos = []; changed = true; }

    if (STATE.comboSeedTag !== COMBO_SEED_TAG) {
      // The 3 built-in yield groups (SMT/Through-hole/Test) are always-on and computed
      // directly from SMT_YIELD_NAMES/THROUGHHOLE_YIELD_NAMES/TEST_YIELD_NAMES — they are
      // NOT stored as user combos. STATE.combos only holds manager-created custom groups.
      if (!STATE.combos) STATE.combos = [];
      STATE.comboSeedTag = COMBO_SEED_TAG;
      changed = true;
    }
    [SMT_YIELD_NAMES, THROUGHHOLE_YIELD_NAMES, TEST_YIELD_NAMES].forEach(function(list){
      list.forEach(function(name){
        const key = name.trim().toLowerCase();
        const found = STATE.tasks.some(function(t){ return t.name.trim().toLowerCase() === key; });
        if (!found) console.warn('Yield group task name did not resolve to any task: "'+name+'"');
      });
    });

    if (STATE.ppuSeedTag !== PPU_SEED_TAG) {
      STATE.tasks.forEach(function(t){
        if (t.partsPerUnit === undefined) {
          const key = t.name.trim().toLowerCase();
          if (Object.prototype.hasOwnProperty.call(TOUCHUP_PARTS, key)) t.partsPerUnit = TOUCHUP_PARTS[key];
        }
      });
      STATE.ppuSeedTag = PPU_SEED_TAG;
      changed = true;
    }

    if (STATE.seedTag !== SEED_TAG) {
      const existing = {};
      STATE.tasks.forEach(function(t){ existing[t.name.trim().toLowerCase()] = true; });
      DEFAULT_TASK_NAMES.forEach(function(name,i){
        const key = name.trim().toLowerCase();
        if (!existing[key]) {
          STATE.tasks.push({ id: slugify(name)+"-new"+i, name:name, active:true, aliases:[] });
          existing[key] = true;
        }
      });
      STATE.seedTag = SEED_TAG;
      changed = true;
    }
    if (!STATE.headlineTaskId || !findTask(STATE.headlineTaskId)) {
      const headline = STATE.tasks.find(function(t){ return t.name.trim().toLowerCase() === "7000ai provisioning"; });
      if (headline) { STATE.headlineTaskId = headline.id; changed = true; }
    }
    if (!STATE.serials) { STATE.serials = []; changed = true; }
    if (!STATE.serialTaskId || !findTask(STATE.serialTaskId)) {
      const serialTask = STATE.tasks.find(function(t){ return t.name.trim().toLowerCase() === "7000ai provisioning"; });
      if (serialTask) { STATE.serialTaskId = serialTask.id; changed = true; }
    }
    if (!STATE.serialFormat || !STATE.serialFormat.totalLength || !STATE.serialFormat.prefixes) {
      STATE.serialFormat = Object.assign({}, DEFAULT_SERIAL_FORMAT);
      changed = true;
    }

    if (STATE.smtSeedTag !== SMT_SEED_TAG) {
      const existingSmt = {};
      STATE.tasks.forEach(function(t){ existingSmt[t.name.trim().toLowerCase()] = true; });
      const toPrepend = [];
      SMT_TOP_TASK_NAMES.forEach(function(name,i){
        const key = name.trim().toLowerCase();
        if (!existingSmt[key]) {
          toPrepend.push({ id: slugify(name)+"-smtnew"+i, name:name, active:true, aliases:[] });
          existingSmt[key] = true;
        }
      });
      if (toPrepend.length) STATE.tasks = toPrepend.concat(STATE.tasks);
      STATE.smtSeedTag = SMT_SEED_TAG;
      changed = true;
    }

    if (STATE.workerSeedTag !== WORKER_SEED_TAG) {
      const existingW = {};
      STATE.workers.forEach(function(w){ existingW[w.name.trim().toLowerCase()] = true; });
      DEFAULT_WORKER_NAMES.forEach(function(name,i){
        const key = name.trim().toLowerCase();
        if (!existingW[key]) {
          STATE.workers.push({ id:"w-"+slugify(name).slice(2)+"-new"+i, name:name, active:true });
          existingW[key] = true;
        }
      });
      const sample = STATE.workers.find(function(w){ return w.name.trim().toLowerCase() === "sample worker"; });
      if (sample && sample.active) sample.active = false;
      STATE.workerSeedTag = WORKER_SEED_TAG;
      changed = true;
    }

    if (STATE.standupSeedTag !== STANDUP_SEED_TAG) {
      if (!STATE.standup) STATE.standup = Object.assign({}, DEFAULT_STANDUP);
      STATE.standupSeedTag = STANDUP_SEED_TAG;
      changed = true;
    }
    if (!STATE.standup) { STATE.standup = Object.assign({}, DEFAULT_STANDUP); changed = true; }
    if (!Array.isArray(STATE.standup.days)) { STATE.standup.days = DEFAULT_STANDUP.days.slice(); changed = true; }
    if (typeof STATE.standup.hour !== "number") { STATE.standup.hour = DEFAULT_STANDUP.hour; changed = true; }
    if (typeof STATE.standup.minute !== "number") { STATE.standup.minute = DEFAULT_STANDUP.minute; changed = true; }
    if (typeof STATE.standup.enabled !== "boolean") { STATE.standup.enabled = DEFAULT_STANDUP.enabled; changed = true; }
    return changed;
  }

  /* ---------------- standup meeting reminder ---------------- */
  function computeStandupOverlay(){
    if (!STATE || !STATE.standup || !STATE.standup.enabled) return null;
    const cfg = STATE.standup;
    const now = new Date();
    const dow = now.getDay();
    if ((cfg.days||[]).indexOf(dow) === -1) return null;
    const occ = new Date(now.getFullYear(), now.getMonth(), now.getDate(), cfg.hour||0, cfg.minute||0, 0, 0);
    const occTs = occ.getTime();
    const nowTs = now.getTime();
    const dayEndTs = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999).getTime();
    const ackedAt = getStandupAckedAt();
    if (ackedAt && ackedAt >= occTs) return null; // this occurrence already acknowledged on this device
    if (nowTs < occTs - 60000) return null; // more than 1 minute before — nothing to show yet
    if (nowTs > dayEndTs) return null; // stale — day has ended, wait for the next scheduled occurrence
    if (nowTs < occTs) {
      return { phase:"countdown", occTs:occTs, secondsLeft: Math.max(1, Math.ceil((occTs - nowTs)/1000)) };
    }
    const elapsed = nowTs - occTs;
    if (elapsed < 5000) return { phase:"blinking", occTs:occTs };
    return { phase:"holding", occTs:occTs };
  }
  function standupStateKey(s){
    return s ? (s.phase+":"+s.occTs+":"+(s.secondsLeft||0)) : "none";
  }
  function startStandupClock(){
    if (standupClockTimer) return;
    standupClockTimer = setInterval(function(){
      const next = computeStandupOverlay();
      if (standupStateKey(next) !== standupStateKey(standupOverlayState)) {
        standupOverlayState = next;
        render();
      }
    }, 1000);
  }
  function standupOverlayHtml(){
    const s = standupOverlayState;
    if (!s) return "";
    const decor =
      '<svg class="standup-svg" style="top:18px;left:18px;width:70px;height:70px;" viewBox="0 0 100 100" aria-hidden="true">'+
        '<g fill="none" stroke="#08222c" stroke-width="4">'+
          '<circle cx="50" cy="50" r="22"/>'+
          '<circle cx="50" cy="50" r="8" fill="#08222c"/>'+
          '<g>'+[0,45,90,135,180,225,270,315].map(function(a){
            return '<rect x="47" y="6" width="6" height="16" rx="2" transform="rotate('+a+' 50 50)"/>';
          }).join("")+'</g>'+
        '</g>'+
      '</svg>'+
      '<svg class="standup-svg" style="bottom:18px;right:18px;width:80px;height:80px;" viewBox="0 0 100 100" aria-hidden="true">'+
        '<g fill="none" stroke="#08222c" stroke-width="4">'+
          '<circle cx="50" cy="50" r="16"/>'+
          '<circle cx="50" cy="50" r="6" fill="#08222c"/>'+
          '<g>'+[0,60,120,180,240,300].map(function(a){
            return '<rect x="47" y="4" width="6" height="14" rx="2" transform="rotate('+a+' 50 50)"/>';
          }).join("")+'</g>'+
        '</g>'+
      '</svg>'+
      '<svg class="standup-svg" style="bottom:24px;left:6%;width:34%;height:36px;" viewBox="0 0 300 40" preserveAspectRatio="none" aria-hidden="true">'+
        '<g fill="none" stroke="#08222c" stroke-width="4">'+
          '<line x1="0" y1="20" x2="300" y2="20"/>'+
          '<line x1="0" y1="30" x2="300" y2="30"/>'+
          [0,30,60,90,120,150,180,210,240,270,300].map(function(x){
            return '<line x1="'+x+'" y1="20" x2="'+x+'" y2="30"/>';
          }).join("")+
        '</g>'+
      '</svg>'+
      '<svg class="standup-svg" style="top:8%;right:6%;width:30%;height:60px;" viewBox="0 0 220 60" preserveAspectRatio="none" aria-hidden="true">'+
        '<g fill="none" stroke="#08222c" stroke-width="3">'+
          '<path d="M0 30 H60 V10 H140 V50 H220"/>'+
          '<circle cx="60" cy="30" r="4" fill="#08222c" stroke="none"/>'+
          '<circle cx="140" cy="10" r="4" fill="#08222c" stroke="none"/>'+
          '<circle cx="140" cy="50" r="4" fill="#08222c" stroke="none"/>'+
        '</g>'+
      '</svg>';

    if (s.phase === "countdown") {
      const m = Math.floor(s.secondsLeft/60), sec = s.secondsLeft%60;
      const clock = (m>0 ? (m+":"+pad2(sec)) : String(sec));
      return (
        '<div class="standup-overlay">'+decor+
          '<div class="kiosk-eyebrow" style="color:#08222c;">Coming up</div>'+
          '<h2>Stand-up Meeting</h2>'+
          '<div class="standup-timer num">'+clock+'</div>'+
          '<div style="color:#08222c;font-size:16px;">starting in the workshop — head over now</div>'+
        '</div>'
      );
    }
    if (s.phase === "blinking") {
      return (
        '<div class="standup-overlay blinking">'+decor+
          '<h2>Stand-up Meeting</h2>'+
          '<div class="standup-timer num">NOW</div>'+
        '</div>'
      );
    }
    // holding
    return (
      '<div class="standup-overlay">'+decor+
        '<h2 style="font-size:clamp(30px,7vw,58px);">Stand-up Meeting — Now</h2>'+
        '<div style="color:#08222c;font-size:17px;max-width:420px;">Head to the meeting point. Tap below once you’ve seen this.</div>'+
        '<button class="btn btn-primary" style="width:auto;padding:18px 34px;background:#08222c;color:#fff;" onclick="App.ackStandup()">Acknowledge</button>'+
      '</div>'
    );
  }

  let firstSnapshot = true;
  let applyingRemote = false;

  async function init(){
    loadUi();
    STATE = buildDefaultState();
    migrateState();
    standupOverlayState = computeStandupOverlay();
    render();
    startStandupClock();

    try {
      dbApi = await Promise.race([
        window.ShiftFloorDBReady || Promise.resolve(null),
        new Promise(function(resolve){ setTimeout(function(){ resolve(null); }, 10500); })
      ]);
    } catch(e){ dbApi = null; }

    if (!dbApi) {
      // We have no way to know whether real data exists in Firestore, so we must
      // NOT assume it's safe to show/seed the blank default state. Stay unconfirmed
      // and show the "can't connect" screen instead of the normal UI.
      saveStatus = "offline";
      connectFailed = true;
      render();
      return;
    }

    dbApi.subscribe(function(remoteState){
      if (firstSnapshot) {
        firstSnapshot = false;
        if (remoteState) {
          STATE = remoteState;
          const changed = migrateState();
          stateConfirmed = true;
          saveStatus = "saved";
          render();
          if (changed) persist(true);
        } else {
          // First run: Firestore confirmed the document truly doesn't exist yet —
          // legitimate brand-new setup. Safe to seed defaults.
          const changed = migrateState();
          stateConfirmed = true;
          persist(true);
        }
        return;
      }
      // Live update from another tablet/dashboard.
      applyingRemote = true;
      STATE = remoteState || STATE;
      migrateState();
      saveStatus = "saved";
      render();
      applyingRemote = false;
    });
  }

  let persistTimer = null, retryTimer = null, retryCount = 0;
  function scheduleRetry(){
    if (retryCount >= 3) return;
    retryCount++;
    clearTimeout(retryTimer);
    retryTimer = setTimeout(function(){ persist(true); }, 6000*retryCount);
  }
  function persist(silent, successMsg, failMsg){
    if (!stateConfirmed) {
      // Safety net: never let a stray save path write default/unconfirmed state
      // over whatever is really in Firestore before we've confirmed what that is.
      console.warn("Shift Floor: persist() called before state was confirmed — ignoring.");
      return;
    }
    if (!dbApi) {
      saveStatus = "offline";
      if (failMsg) showToast(failMsg);
      if (!silent) render();
      return;
    }
    saveStatus = "saving";
    if (!silent) render();
    clearTimeout(persistTimer);
    persistTimer = setTimeout(async function(){
      try {
        await dbApi.save(STATE);
        saveStatus = "saved";
        retryCount = 0;
        if (successMsg) showToast(successMsg);
        render();
      } catch(err){
        saveStatus = "offline";
        if (failMsg) showToast(failMsg);
        scheduleRetry();
        render();
      }
    }, 150);
  }

  /* ---------------- data helpers ---------------- */
  function activeTasks(){ return STATE.tasks.filter(function(t){ return t.active; }); }
  function activeWorkers(){ return STATE.workers.filter(function(w){ return w.active; }); }
  function findTask(id){ return STATE.tasks.find(function(t){ return t.id===id; }); }
  function findWorker(id){ return STATE.workers.find(function(w){ return w.id===id; }); }
  function validateSerialFormat(raw){
    const fmt = STATE.serialFormat || DEFAULT_SERIAL_FORMAT;
    if (!/^[0-9]+$/.test(raw)) return "Wrong format — digits only.";
    if (raw.length !== fmt.totalLength) return "Wrong format — must be "+fmt.totalLength+" digits total.";
    const okPrefix = (fmt.prefixes||[]).some(function(p){ return raw.indexOf(p)===0; });
    if (!okPrefix) return "Wrong format — must start with "+(fmt.prefixes||[]).join(" or ")+".";
    return null;
  }
  function focusSelectSerialInput(clearValue){
    setTimeout(function(){
      const el = document.getElementById("serialInput");
      if (!el) return;
      el.focus();
      if (clearValue) el.value = "";
      else el.select();
    }, 0);
  }
  function findTaskByNameOrAlias(label){
    const key = (label||"").trim().toLowerCase();
    if (!key) return null;
    return STATE.tasks.find(function(t){
      if (t.name.trim().toLowerCase() === key) return true;
      return (t.aliases||[]).some(function(a){ return a.trim().toLowerCase() === key; });
    }) || null;
  }

  function aggregateWeek(weekKey){
    const byTask = {};
    STATE.entries.forEach(function(e){
      if (weekKeyOf(e.entryDate) !== weekKey) return;
      const agg = byTask[e.taskId] || (byTask[e.taskId] = { made:0, faults:0, count:0, lastTs:null, lastEntry:null });
      agg.made += e.made;
      agg.faults += e.faults;
      agg.count += 1;
      if (!agg.lastTs || new Date(e.ts) > new Date(agg.lastTs)) { agg.lastTs = e.ts; agg.lastEntry = e; }
    });
    return byTask;
  }
  function aggregateMonth(monthKey){
    const byTask = {};
    STATE.entries.forEach(function(e){
      if (monthKeyOf(e.entryDate) !== monthKey) return;
      const agg = byTask[e.taskId] || (byTask[e.taskId] = { made:0, faults:0, count:0, lastTs:null, lastEntry:null });
      agg.made += e.made;
      agg.faults += e.faults;
      agg.count += 1;
      if (!agg.lastTs || new Date(e.ts) > new Date(agg.lastTs)) { agg.lastTs = e.ts; agg.lastEntry = e; }
    });
    return byTask;
  }
  function yieldPct(made, faults, ppu){
    ppu = ppu || 1;
    const total = made*ppu;
    return total > 0 ? ((total - faults)/total*100) : null;
  }
  function faultPct(made, faults, ppu){
    ppu = ppu || 1;
    const total = made*ppu;
    return total > 0 ? (faults/total*100) : null;
  }
  function tierFor(kind, pct){
    if (pct == null) return "idle";
    if (kind === "yield") return pct >= 97 ? "good" : (pct >= 90 ? "warn" : "bad");
    return pct <= 3 ? "good" : (pct <= 10 ? "warn" : "bad");
  }
  function comboTotals(taskIds, curAgg){
    let made=0, faults=0, capacity=0;
    (taskIds||[]).forEach(function(tid){
      const a = curAgg[tid];
      if (!a) return;
      const t = findTask(tid);
      const ppu = (t && t.partsPerUnit) || 1;
      made += a.made; faults += a.faults; capacity += a.made*ppu;
    });
    return { made:made, faults:faults, capacity:capacity, yield:yieldPct(capacity,faults,1), faultRate:faultPct(capacity,faults,1) };
  }
  function buildWorkerTaskRows(filterFn){
    const byWorker = {};
    STATE.entries.filter(filterFn).forEach(function(e){
      const task = findTask(e.taskId);
      const ppu = (task && task.partsPerUnit) || 1;
      const w = byWorker[e.workerId] || (byWorker[e.workerId] = { workerId:e.workerId, tasks:{}, made:0, faults:0, capacity:0 });
      const tk = w.tasks[e.taskId] || (w.tasks[e.taskId] = { made:0, faults:0, capacity:0, ppu:ppu });
      tk.made += e.made; tk.faults += e.faults;
    });
    // Negative correction entries (Fix 2) are summed in as-is above; clamp the AGGREGATE
    // running total at zero here (never the individual entry) so a correction can't drive
    // a displayed total, capacity, or yield below zero.
    Object.keys(byWorker).forEach(function(workerId){
      const w = byWorker[workerId];
      Object.keys(w.tasks).forEach(function(taskId){
        const tk = w.tasks[taskId];
        tk.made = Math.max(0, tk.made);
        tk.faults = Math.max(0, tk.faults);
        tk.capacity = tk.made * tk.ppu;
        delete tk.ppu;
        w.made += tk.made; w.faults += tk.faults; w.capacity += tk.capacity;
      });
    });
    return byWorker;
  }

  function addEntry(workerId, taskId, made, faults, by, opts){
    opts = opts || {};
    const task = findTask(taskId);
    const ppu = (task && task.partsPerUnit) || 1;
    const madeNum = toSignedInt(made);
    let faultsNum = toSignedInt(faults);
    // The made*ppu cap on faults only makes sense for a normal (non-negative) entry.
    // A negative correction entry (Fix 2 — worker self-service correction) is stored
    // exactly as typed, uncapped, so it becomes its own auditable row and nets out of
    // the running total cleanly. Any resulting negative running total is clamped to
    // zero where totals are aggregated for display (buildWorkerTaskRows), not here.
    if (madeNum >= 0 && faultsNum >= 0) {
      faultsNum = Math.min(faultsNum, madeNum*ppu);
    }
    const ts = opts.ts || new Date().toISOString();
    const entry = {
      id: uid("e"),
      workerId: workerId,
      taskId: taskId,
      made: madeNum,
      faults: faultsNum,
      ts: ts,
      // The day this entry is attributed to for weekly/monthly/YTD bucketing (Fix 3) —
      // distinct from ts, which stays the real submission moment for audit/ordering.
      entryDate: opts.entryDate || dateOnlyStr(ts),
      by: by
    };
    STATE.entries.push(entry);
    persist(false, opts.successMsg, opts.failMsg);
    return entry;
  }

  function resolveNamesToIds(names){

  function managerDashboardBody(){
    const now = new Date();
    const curStart = weekStartFor(now);
    const curKey = weekKeyOf(now);
    const prevStart = new Date(curStart); prevStart.setDate(prevStart.getDate()-7);
    const prevKey = weekKeyOf(prevStart);

    const curAgg = aggregateWeek(curKey);
    const prevAgg = aggregateWeek(prevKey);
    const pendingCount = STATE.pendingRequests.filter(function(r){ return r.status==="pending"; }).length;

    const headlineTask = findTask(STATE.headlineTaskId);
    const hAgg = headlineTask ? curAgg[headlineTask.id] : null;
    const hMade = hAgg?hAgg.made:0, hFaults = hAgg?hAgg.faults:0;
    const hPpu = (headlineTask && headlineTask.partsPerUnit) || 1;
    const hYield = yieldPct(hMade,hFaults,hPpu), hFault = faultPct(hMade,hFaults,hPpu);

    let reassignBanner = "";
    if (isReassignOpen()) {
      const mins = Math.max(1, Math.ceil((new Date(STATE.reassignUntil).getTime()-Date.now())/60000));
      reassignBanner = '<div class="card banner" style="background:var(--warn-soft);"><span>🔓 Reassignment window open — any worker tablet can switch worker. Closes in ~'+mins+' min.</span><button class="chip-btn" onclick="App.closeReassignWindow()">Close Now</button></div>';
    }

    const tasks = activeTasks().slice().sort(function(a,b){
      const la = curAgg[a.id] ? new Date(curAgg[a.id].lastTs).getTime() : -1;
      const lb = curAgg[b.id] ? new Date(curAgg[b.id].lastTs).getTime() : -1;
      if (la !== lb) return lb - la;
      return a.name.localeCompare(b.name);
    });
    const cards = tasks.map(function(t){ return taskCardHtml(t, curAgg, {}); }).join("");

    const prevTasks = STATE.tasks.filter(function(t){ return prevAgg[t.id]; });
    let prevMade=0, prevFaults=0;
    const prevRows = prevTasks.map(function(t){
      const a = prevAgg[t.id];
      const ppu = t.partsPerUnit || 1;
      prevMade += a.made; prevFaults += a.faults;
      return '<tr><td>'+escapeHtml(t.name)+'</td><td class="num">'+a.made+'</td><td class="num">'+a.faults+'</td>'+
        '<td class="num">'+fmtPct(yieldPct(a.made,a.faults,ppu))+'</td><td class="num">'+fmtPct(faultPct(a.made,a.faults,ppu))+'</td></tr>';

        '<div class="toolbar">'+
          '<button onclick="App.openModal(\'enterFor\')">+ Enter for a Worker</button>'+
          '<button onclick="App.gotoManager(\'review\')">Review Jobs'+(pendingCount?(' ('+pendingCount+')'):'')+'</button>'+
          '<button onclick="App.gotoManager(\'notices\')">Notice Board</button>'+
          '<button onclick="App.gotoManager(\'assigner\')">Task Assigner</button>'+
          '<button onclick="App.gotoManager(\'summary\')">Worker Summary</button>'+
          '<button onclick="App.gotoManager(\'entries\')">Entry Log</button>'+
          '<button onclick="App.gotoManager(\'tasks\')">Manage Tasks</button>'+
          '<button onclick="App.gotoManager(\'workers\')">Manage Workers</button>'+
          '<button onclick="App.gotoManager(\'settings\')">Settings</button>'+
          '<button onclick="App.openModal(\'reassign\')">🔓 Open Reassignment Window</button>'+
          '<button onclick="App.downloadWeeklySummary()">⬇ Download Weekly Summary</button>'+
          '<button onclick="App.downloadMonthlySummary()">⬇ Download Monthly Summary</button>'+
        '</div>'+
      '</div>'+

      priorityWatchSection(curAgg)+

      '<div style="margin-top:26px;">'+totalYieldSection(curAgg)+'</div>'+

      '<div class="section-title" style="margin-top:26px;">'+escapeHtml(headlineTask?headlineTask.name:"Headline job")+'</div>'+
      '<div class="overall-row">'+
        '<div class="card stat-tile"><div class="label">Total 7000AI Made</div><div class="value">'+hMade+'</div></div>'+
        '<div class="card stat-tile"><div class="label">Total Faults</div><div class="value">'+hFaults+'</div></div>'+
        '<div class="card stat-tile"><div class="label">Yield</div><div class="value '+tierFor("yield",hYield)+'">'+fmtPct(hYield)+'</div></div>'+
        '<div class="card stat-tile"><div class="label">Fault Rate</div><div class="value '+tierFor("fault",hFault)+'">'+fmtPct(hFault)+'</div></div>'+
      '</div>'+

      serialPanelSection(curKey)+

      '<div class="section-title">Tasks · most recently updated first</div>'+
      (cards ? '<div class="task-grid">'+cards+'</div>' : '<div class="card" style="padding:20px;color:var(--muted);">No tasks yet — add one under Manage Tasks.</div>')+

      '<div class="section-title">Last Week Summary</div>'+

  function workerRowsTableHtml(byWorker){
    const workerIds = Object.keys(byWorker);
    if (!workerIds.length) return '<div style="color:var(--muted);font-size:14px;margin-bottom:18px;">No activity recorded.</div>';
    workerIds.sort(function(a,b){
      const wa = findWorker(a), wb = findWorker(b);
      return (wa?wa.name:"").localeCompare(wb?wb.name:"");
    });
    let rows = "";
    workerIds.forEach(function(wid){
      const w = byWorker[wid];
      const worker = findWorker(wid);
      rows += '<tr style="background:var(--surface-2);"><td colspan="4"><b>'+escapeHtml(worker?worker.name:"Unknown worker")+'</b></td></tr>';
      Object.keys(w.tasks).sort(function(a,b){
        const ta=findTask(a), tb=findTask(b);
        return (ta?ta.name:"").localeCompare(tb?tb.name:"");
      }).forEach(function(tid){
        const t = findTask(tid);
        const tk = w.tasks[tid];
        const ppu = (t && t.partsPerUnit) || 1;
        rows += '<tr><td style="padding-left:22px;color:var(--muted);">'+escapeHtml(t?t.name:"(deleted task)")+'</td>'+
          '<td class="num">'+tk.made+'</td><td class="num">'+tk.faults+'</td>'+
          '<td class="num">'+fmtPct(yieldPct(tk.made,tk.faults,ppu))+'</td></tr>';
      });
      rows += '<tr><td style="padding-left:22px;"><i>Worker total</i></td><td class="num"><b>'+w.made+'</b></td><td class="num"><b>'+w.faults+'</b></td><td class="num"><b>'+fmtPct(yieldPct(w.made,w.faults))+'</b></td></tr>';
    });
    return '<div class="table-wrap" style="margin-bottom:22px;"><table class="data-table"><thead><tr><th>Task</th><th class="num">Made</th><th class="num">Faults</th><th class="num">Yield</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }

  /* ---------------- actions ---------------- */
  const App = {
    switchMode: function(m){ setDeviceMode(m); ui = { screen:null }; saveUi(); render(); },
    goto: function(screen){ setUi({ screen:screen }); },
    toggleRecall: function(){ setUi({ recallNotices: !ui.recallNotices }); },
    ackItem: function(kind,id){
      const map = { notice:"td_ackNotices", msg:"td_ackWorkerMsgs", assign:"td_ackAssignments", mgrnotice:"td_ackMgrNotices" };
      ackAdd(map[kind], id);
      if (kind==="notice") ui.recallNotices = false;
      render();
    },
    confirmOwnerPick: function(){
      const sel = document.getElementById("ownerSelect");
      if (!sel || !sel.value) return;
      setAssignedWorkerId(sel.value);
      setUi({ screen:"pickTask" });
    },
    changeOwner: function(){ setAssignedWorkerId(null); setUi({ screen:"pickOwner" }); },
    pickTask: function(){
      const sel = document.getElementById("taskSelect");
      if (!sel || !sel.value) return;
      if (sel.value === "__other__") setUi({ screen:"otherJobLabel" });
      else setUi({ screen:"enterMade", taskId:sel.value });
    },
    submitOtherLabel: function(){
      const input = document.getElementById("otherJobInput");
      const label = input ? input.value.trim() : "";
      if (!label) return;
      setUi({ screen:"enterMade", taskId:"__other__", otherLabel:label });
    },
    submitMade: function(){
      const input = document.getElementById("madeInput");
      const val = toSignedInt(input ? input.value : 0);
      setUi({ screen:"enterFaults", made:val });
    },
    goScanSerials: function(){
      const input = document.getElementById("faultsInput");
      const faults = clamp0(Math.min(clamp0(input ? input.value : 0), ui.made));
      setUi({ screen:"scanSerials", faults:faults, serialsList: [], serialError:null });
    },
    addScannedSerial: function(){
      const input = document.getElementById("serialInput");
      const raw = input ? input.value.trim() : "";
      if (!raw) return;
      const needed = Math.max(0, ui.made - ui.faults);
      const list = (ui.serialsList || []).slice();
      if (list.length >= needed) { showToast("Already have "+needed+" serial(s) for this batch."); return; }

      const fmtErr = validateSerialFormat(raw);
      if (fmtErr) { setUi({ serialError:{ value:raw, message:fmtErr } }); focusSelectSerialInput(false); return; }

      const dup = STATE.serials.some(function(s){ return s.serial===raw; }) || list.indexOf(raw)>-1;
      if (dup) { setUi({ serialError:{ value:raw, message:"Already recorded — enter a different serial." } }); focusSelectSerialInput(false); return; }

      list.push(raw);
      setUi({ serialsList:list, serialError:null });
      focusSelectSerialInput(true);
    },
    removeScannedSerial: function(idx){
      const list = (ui.serialsList || []).slice();
      list.splice(idx,1);
      setUi({ serialsList:list });
    },
    submitFaults: function(){
      const workerId = getAssignedWorkerId();
      const made = ui.made;
      let faults;
      if (ui.screen === "scanSerials") {
        faults = ui.faults;
      } else {
        const input = document.getElementById("faultsInput");
        faults = toSignedInt(input ? input.value : 0);
      }
      const entryDate = ui.entryDate || todayDateOnly();

      if (ui.taskId === "__other__") {
        const label = (ui.otherLabel||"").trim();
        const match = findTaskByNameOrAlias(label);
        if (match) {
          addEntry(workerId, match.id, made, faults, "worker", { entryDate:entryDate, successMsg:"Entry logged to the dashboard ✅", failMsg:"Not sent yet — retrying…" });
          setUi({ screen:"askAnother", faults:faults, resolvedName:match.name, pendingReview:false, serialsCount:null });
        } else {
          STATE.pendingRequests.push({ id:uid("p"), workerId:workerId, label:label, made:made, faults:faults, ts:new Date().toISOString(), entryDate:entryDate, status:"pending" });
          persist(false, "Sent to the manager for review ✅", "Not sent yet — retrying…");
          setUi({ screen:"askAnother", faults:faults, pendingReview:true, resolvedName:null, serialsCount:null });
        }
      } else {
        const serialsToSave = (ui.taskId === STATE.serialTaskId) ? (ui.serialsList||[]) : null;
        if (serialsToSave) {
          const needed = Math.max(0, made - faults);
          if (serialsToSave.length !== needed) { showToast("Enter all "+needed+" serial number(s) first."); return; }
        }
        const entry = addEntry(workerId, ui.taskId, made, faults, "worker", { entryDate:entryDate, successMsg:"Entry logged to the dashboard ✅", failMsg:"Not sent yet — retrying…" });
        if (serialsToSave && serialsToSave.length) {
          const ts = new Date().toISOString();
          serialsToSave.forEach(function(s){
            STATE.serials.push({ id:uid("s"), serial:s, taskId:ui.taskId, workerId:workerId, entryId:entry.id, ts:ts });
          });
        }
        setUi({ screen:"askAnother", faults:faults, resolvedName:null, pendingReview:false, serialsList:null, serialsCount: serialsToSave ? serialsToSave.length : null });
      }
    },
    setEntryDate: function(val){
      if (!val || !/^\d{4}-\d{2}-\d{2}$/.test(val)) return;
      const minD = new Date(); minD.setHours(0,0,0,0); minD.setDate(minD.getDate()-60);
      const maxD = new Date(); maxD.setHours(0,0,0,0);
      const picked = parseDateBasis(val);
      if (picked < minD || picked > maxD) { showToast("Pick a date within the last 60 days, not in the future."); return; }
      setUi({ entryDate: val });
    },
    toggleEntryDateEdit: function(on){ setUi({ entryDateEditing: !!on, entryDate: on ? (ui.entryDate || todayDateOnly()) : null }); },
    anotherJob: function(yes){
      if (yes) setUi({ screen:"pickTask", taskId:null, made:0, faults:0, otherLabel:null, resolvedName:null, pendingReview:false, serialsList:null, serialsCount:null, entryDate:null, entryDateEditing:false });
      else setUi({ screen:"confirmOwner", taskId:null, made:0, faults:0, otherLabel:null, resolvedName:null, pendingReview:false, serialsList:null, serialsCount:null, entryDate:null, entryDateEditing:false });
    },
    submitPin: function(){
      const input = document.getElementById("pinInput");
      const val = input ? input.value : "";
      const match = (STATE.managers||[]).find(function(m){ return m.pin === val; });
      if (match) { setMgrIdentity(match.id); setUi({ pinError:false, mScreen:"dashboard" }); }
      else setUi({ pinError:true });

    gotoManager: function(screen){ setUi({ mScreen:screen }); },
    openModal: function(name){ setUi({ modal:name }); },
    closeModal: function(){ setUi({ modal:null }); },

    addTask: function(){
      const input = document.getElementById("newTaskName");
      const name = input ? input.value.trim() : "";
      if (!name) return;
      STATE.tasks.push({ id: slugify(name)+"-"+uid(""), name:name, active:true, aliases:[] });
      persist(); render();
    },
    toggleTask: function(id){ const t = findTask(id); if (t) { t.active = !t.active; persist(); render(); } },
    startTaskEdit: function(id){ setUi({ editingTaskId:id }); },
    cancelTaskEdit: function(){ setUi({ editingTaskId:null }); },
    saveTaskEdit: function(id){
      const input = document.getElementById("editTaskName");
      const name = input ? input.value.trim() : "";
      if (!name) return;
      const t = findTask(id);
      if (t) t.name = name;
      ui.editingTaskId = null; saveUi();
      persist(); render();
    },
    reorderTask: function(ev, targetId){
      ev.preventDefault();
      const draggedId = ev.dataTransfer.getData("text/plain");
      if (!draggedId || draggedId===targetId) return;
      const list = STATE.tasks.slice();
      const fromIdx = list.findIndex(function(t){ return t.id===draggedId; });
      const toIdx = list.findIndex(function(t){ return t.id===targetId; });
      if (fromIdx===-1 || toIdx===-1) return;
      const item = list.splice(fromIdx,1)[0];
      list.splice(toIdx,0,item);
      STATE.tasks = list;
      persist(); render();
    },
    deleteTask: function(id){
      const t = findTask(id);
      if (!t) return;
      if (!confirm('Delete "'+t.name+'"? This cannot be undone.')) return;
      STATE.tasks = STATE.tasks.filter(function(x){ return x.id!==id; });
      setPriorityPins(getPriorityPins().map(function(pid){ return pid===id?null:pid; }));
      persist(); render();
    },

      const input = document.getElementById("newWorkerName");
      const name = input ? input.value.trim() : "";
      if (!name) return;
      STATE.workers.push({ id: uid("w-"), name:name, active:true });
      persist(); render();
    },
    toggleWorker: function(id){ const w = findWorker(id); if (w) { w.active = !w.active; persist(); render(); } },

      const me = (STATE.managers||[]).find(function(m){ return m.id===identity; });

    savePpu: function(taskId){
      if (getMgrIdentity() !== "mark") return;
      const input = document.getElementById("ppuInput-"+taskId);
      const t = findTask(taskId);
      const val = clamp0(input ? input.value : 0);
      if (!t || !val) { showToast("Enter a valid number."); return; }
      t.partsPerUnit = val;
      STATE.managerNotices.push({ id:uid("mn"), kind:"ppu_change", text:"Mark changed "+t.name+" parts-per-unit to "+val, ts:new Date().toISOString(), by:"mark" });
      persist(false, "Parts-per-unit saved.", "Saved locally — will sync.");
      render();
    },
    saveHeadlineTask: function(){
      const sel = document.getElementById("headlineTaskSelect");
      if (!sel) return;
      STATE.headlineTaskId = sel.value; persist(); showToast("Headline job updated."); render();
    },
    pinTask: function(taskId){
      const slots = getPriorityPins();
      if (slots.indexOf(taskId)>-1) return;
      const emptyIdx = slots.indexOf(null);
      if (emptyIdx===-1) { showToast("All 4 priority slots are full — unpin one first."); return; }
      slots[emptyIdx] = taskId; setPriorityPins(slots); render();
    },
    unpinTask: function(idx){ const slots = getPriorityPins(); slots[idx] = null; setPriorityPins(slots); render(); },
    togglePriorityCollapse: function(){ setPriorityCollapsed(!isPriorityCollapsed()); render(); },
    toggleYieldCollapse: function(){ setYieldCollapsed(!isYieldCollapsed()); render(); },
    toggleAddCombo: function(){ setUi({ addingCombo: !ui.addingCombo }); },
    saveNewCombo: function(){
      if ((STATE.combos||[]).length >= 5) { showToast("Max 5 combinations."); return; }
      const nameInput = document.getElementById("comboName");
      const name = nameInput ? nameInput.value.trim() : "";
      const boxes = document.querySelectorAll(".comboTaskChk:checked");
      const taskIds = Array.prototype.map.call(boxes, function(b){ return b.value; });
      if (!name || !taskIds.length) { showToast("Name it and pick at least one task."); return; }
      STATE.combos.push({ id:uid("c"), name:name, taskIds:taskIds });
      persist(false, "Combination added.");
      setUi({ addingCombo:false });
    },
    deleteCombo: function(id){
      const c = (STATE.combos||[]).find(function(x){ return x.id===id; });
      if (!c) return;
      if (!confirm('Delete combination "'+c.name+'"?')) return;
      STATE.combos = STATE.combos.filter(function(x){ return x.id!==id; });
      persist(); render();
    },
    openReassignWindow: function(minutes){
      minutes = clamp0(minutes);
      if (!minutes) { showToast("Enter minutes."); return; }
      STATE.reassignUntil = Date.now() + minutes*60000;
      persist(false, "Reassignment window open for "+minutes+" minutes.");
      setUi({ modal:null });
    },
    openReassignWindowCustom: function(){
      const input = document.getElementById("reassignMinutes");
      App.openReassignWindow(clamp0(input ? input.value : 0));
    },
    closeReassignWindow: function(){
      STATE.reassignUntil = null;
      persist(false, "Reassignment window closed.");
      render();
    },
    startEntryEdit: function(id){ setUi({ editingEntryId:id, confirmDeleteEntryId:null }); },
    cancelEntryEdit: function(){ setUi({ editingEntryId:null }); },
    saveEntryEdit: function(id){
      const e = STATE.entries.find(function(x){ return x.id===id; });
      if (!e) return;
      const madeInput = document.getElementById("editEntryMade-"+id);
      const faultsInput = document.getElementById("editEntryFaults-"+id);
      const made = clamp0(madeInput ? madeInput.value : e.made);
      const task = findTask(e.taskId);
      const ppu = (task && task.partsPerUnit) || 1;
      const faults = clamp0(Math.min(clamp0(faultsInput ? faultsInput.value : e.faults), made*ppu));
      e.made = made; e.faults = faults;
      ui.editingEntryId = null; saveUi();
      persist(false, "Entry updated.");
      render();
    },
    startDeleteEntry: function(id){ setUi({ confirmDeleteEntryId:id, editingEntryId:null }); },
    cancelDeleteEntry: function(){ setUi({ confirmDeleteEntryId:null }); },
    deleteEntry: function(id){
      STATE.entries = STATE.entries.filter(function(e){ return e.id!==id; });
      persist(false, "Entry deleted.");
      setUi({ confirmDeleteEntryId:null });
    },
    toggleSerialsCollapse: function(){ setSerialsCollapsed(!isSerialsCollapsed()); render(); },
    toggleSerialsShowAll: function(){ setUi({ serialsShowAll: !ui.serialsShowAll }); },
    addSerialManual: function(){
      const input = document.getElementById("newSerialManual");
      const val = input ? input.value.trim() : "";
      if (!val) return;
      const fmtErr = validateSerialFormat(val);
      if (fmtErr) { showToast(fmtErr); return; }
      if (STATE.serials.some(function(s){ return s.serial===val; })) { showToast("Already recorded — enter a different serial."); return; }
      STATE.serials.push({ id:uid("s"), serial:val, taskId:STATE.serialTaskId, workerId:null, entryId:null, ts:new Date().toISOString() });
      persist(false, "Serial added.", "Saved locally — will sync.");
      render();
    },
    startSerialEdit: function(id){ setUi({ editingSerialId:id }); },
    cancelSerialEdit: function(){ setUi({ editingSerialId:null }); },
    saveSerialEdit: function(id){
      const input = document.getElementById("editSerialInput");
      const val = input ? input.value.trim() : "";
      if (!val) return;
      const fmtErr = validateSerialFormat(val);
      if (fmtErr) { showToast(fmtErr); return; }
      if (STATE.serials.some(function(s){ return s.id!==id && s.serial===val; })) { showToast("Already recorded — enter a different serial."); return; }
      const s = STATE.serials.find(function(x){ return x.id===id; });
      if (s) s.serial = val;
      ui.editingSerialId = null; saveUi();
      persist(); render();
    },
    saveSerialFormat: function(){
      const lenInput = document.getElementById("serialLenInput");
      const prefixInput = document.getElementById("serialPrefixInput");
      const len = clamp0(lenInput ? lenInput.value : 9) || 9;
      const prefixes = (prefixInput ? prefixInput.value : "").split(",").map(function(p){ return p.trim(); }).filter(Boolean);
      STATE.serialFormat = { totalLength: len, prefixes: prefixes.length ? prefixes : ["7010","701"] };
      persist(); showToast("Serial format updated."); render();
    },
    deleteSerial: function(id){
      if (!confirm("Delete this serial number?")) return;
      STATE.serials = STATE.serials.filter(function(s){ return s.id!==id; });
      persist(); render();
    },
    copySerials: function(){
      const curKey = weekKeyOf(new Date());
      const list = ui.serialsShowAll ? STATE.serials.slice() : STATE.serials.filter(function(s){ return weekKeyOf(s.ts)===curKey; });
      const text = list.map(function(s){ return s.serial; }).join("\n");
      function done(){ showToast("Copied "+list.length+" serial number(s)."); }
      function fail(){
        try {
          const ta = document.createElement("textarea");
          ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          done();
        } catch(e){ showToast("Could not copy — select the list and copy manually."); }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(fail);
      } else { fail(); }
    },
    dropOnSlot: function(ev, idx){
      ev.preventDefault();
      const taskId = ev.dataTransfer.getData("text/plain");
      if (!taskId) return;
      const slots = getPriorityPins().map(function(id){ return id===taskId?null:id; });
      slots[idx] = taskId;
      setPriorityPins(slots);
      render();
    },
    postNotice: function(){
      const input = document.getElementById("newNoticeText");
      const text = input ? input.value.trim() : "";
      if (!text) return;
      STATE.notices.push({ id:uid("n"), text:text, ts:new Date().toISOString() });
      persist(false, "Notice posted.", "Saved locally — will sync.");
      render();
    },
    sendAssignment: function(){
      const boxes = document.querySelectorAll(".asgWorker:checked");
      const workerIds = Array.prototype.map.call(boxes, function(b){ return b.value; });
      const taskSel = document.getElementById("asgTask");
      const noteInput = document.getElementById("asgNote");
      const taskId = taskSel ? taskSel.value : null;
      const note = noteInput ? noteInput.value.trim() : "";
      if (!workerIds.length || !taskId) { showToast("Pick at least one worker and a task."); return; }
      STATE.assignments.push({ id:uid("a"), workerIds:workerIds, taskId:taskId, note:note, ts:new Date().toISOString() });
      persist(false, "Priority message sent.", "Saved locally — will sync.");
      showToast("Sent to "+workerIds.length+" worker(s).");
    },
    resolvePendingMatch: function(reqId, taskId){
      const req = STATE.pendingRequests.find(function(r){ return r.id===reqId; });
      const task = findTask(taskId);
      if (!req || !task) return;
      const key = req.label.trim().toLowerCase();
      if (task.name.trim().toLowerCase()!==key && !(task.aliases||[]).some(function(a){ return a.trim().toLowerCase()===key; })) {
        task.aliases = task.aliases || [];
        task.aliases.push(req.label.trim());
      }
      req.status = "resolved";
      STATE.workerMessages.push({ id:uid("m"), workerId:req.workerId, text:'Manager says: "'+req.label+'" is actually '+task.name, ts:new Date().toISOString() });
      addEntry(req.workerId, task.id, req.made, req.faults, "worker", { ts:req.ts, entryDate:req.entryDate, successMsg:"Matched — worker notified.", failMsg:"Saved locally — will sync." });
      render();
    },
    resolvePendingCreate: function(reqId){
      const req = STATE.pendingRequests.find(function(r){ return r.id===reqId; });
      if (!req) return;
      const name = req.label.trim();
      if (!name) return;
      const newTask = { id: slugify(name)+"-"+uid(""), name:name, active:true, aliases:[] };
      STATE.tasks.push(newTask);
      req.status = "resolved";
      STATE.notices.push({ id:uid("n"), text:"New job: "+name+" created", ts:new Date().toISOString() });
      addEntry(req.workerId, newTask.id, req.made, req.faults, "worker", { ts:req.ts, entryDate:req.entryDate, successMsg:"New task created and announced.", failMsg:"Saved locally — will sync." });
      render();
    },
    submitEnterFor: function(){
      const w = document.getElementById("efWorker").value;
      const t = document.getElementById("efTask").value;
      const made = clamp0(document.getElementById("efMade").value);
      const faults = clamp0(document.getElementById("efFaults").value);
      if (!w || !t) return;
      addEntry(w, t, made, faults, "manager", { successMsg:"Entry saved." });
      setUi({ modal:null });
      showToast("Entry saved for "+((findWorker(w)||{}).name||"worker")+".");
    },
    setSummaryYear: function(y){ setUi({ summaryYear:y }); },
    saveStandupSchedule: function(){
      const enabledEl = document.getElementById("standupEnabled");
      const hourEl = document.getElementById("standupHour");
      const minuteEl = document.getElementById("standupMinute");
      const enabled = enabledEl ? !!enabledEl.checked : true;
      let hour = clamp0(hourEl ? hourEl.value : 11);
      let minute = clamp0(minuteEl ? minuteEl.value : 0);
      if (hour > 23) hour = 23;
      if (minute > 59) minute = 59;
      const days = [];
      for (let d=0; d<7; d++){
        const cb = document.getElementById("standupDay"+d);
        if (cb && cb.checked) days.push(d);
      }
      STATE.standup = { enabled:enabled, days:days, hour:hour, minute:minute };
      persist(false, "Stand-up schedule updated.", "Saved locally — will sync.");
      render();
    },
    ackStandup: function(){
      if (standupOverlayState) setStandupAckedAt(standupOverlayState.occTs);
      standupOverlayState = null;
      render();
    },
    downloadWeeklySummary: function(){
      const now = new Date();
      const curStart = weekStartFor(now);
      const curKey = weekKeyOf(now);
      const agg = aggregateWeek(curKey);
      const rows = [];
      rows.push(["Shift Floor Weekly Summary"]);
      rows.push(["Week", fmtRange(curStart)]);
      rows.push([]);
      rows.push(["Task Summary"]);
      rows.push(["Task","Made","Faults","Yield %","Fault Rate %"]);
      activeTasks().forEach(function(t){
        const a = agg[t.id];
        const made = a?a.made:0, faults = a?a.faults:0;
        const ppu = t.partsPerUnit || 1;
        rows.push([t.name, made, faults, fmtPct(yieldPct(made,faults,ppu)), fmtPct(faultPct(made,faults,ppu))]);
      });
      rows.push([]);
      rows.push(["Worker Summary"]);
      rows.push(["Worker","Task","Made","Faults","Yield %"]);
      const byWorker = buildWorkerTaskRows(function(e){ return weekKeyOf(e.entryDate)===curKey; });
      Object.keys(byWorker).forEach(function(wid){
        const w = byWorker[wid];
        const worker = findWorker(wid);
        Object.keys(w.tasks).forEach(function(tid){
          const t = findTask(tid);
          const tk = w.tasks[tid];
          const ppu = (t && t.partsPerUnit) || 1;
          rows.push([worker?worker.name:"Unknown", t?t.name:"(deleted)", tk.made, tk.faults, fmtPct(yieldPct(tk.made,tk.faults,ppu))]);
        });
        rows.push([(worker?worker.name:"Unknown")+" total", "", w.made, w.faults, fmtPct(yieldPct(w.made,w.faults))]);
      });
      const csv = rows.map(function(r){
        return r.map(function(cell){
          const s = String(cell==null?"":cell);
          return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
        }).join(",");
      }).join("\r\n");
      const csvWithBom = "﻿" + csv;
      const filename = "shift-floor-weekly-"+curKey+".csv";
      downloadCsv(filename, csvWithBom);
      showToast("Weekly summary downloaded.");
    },
    downloadMonthlySummary: function(){
      const now = new Date();
      const mStart = monthStartFor(now);
      const mEnd = monthEndFor(now);
      const monthKey = monthKeyOf(now);
      const isPartial = now < mEnd;
      const agg = aggregateMonth(monthKey);
      const rows = [];
      rows.push(["Shift Floor Monthly Summary"]);
      rows.push(["Month", fmtMonthLabel(mStart)]);
      if (isPartial) rows.push(["Note", "Partial month data through "+now.getFullYear()+"-"+pad2(now.getMonth()+1)+"-"+pad2(now.getDate())]);
      rows.push([]);
      rows.push(["Task Summary"]);
      rows.push(["Task","Made","Faults","Yield %","Fault Rate %"]);
      activeTasks().forEach(function(t){
        const a = agg[t.id];
        const made = a?a.made:0, faults = a?a.faults:0;
        const ppu = t.partsPerUnit || 1;
        rows.push([t.name, made, faults, fmtPct(yieldPct(made,faults,ppu)), fmtPct(faultPct(made,faults,ppu))]);
      });
      rows.push([]);
      rows.push(["Worker Summary"]);
      rows.push(["Worker","Task","Made","Faults","Yield %"]);
      const byWorker = buildWorkerTaskRows(function(e){ return monthKeyOf(e.entryDate)===monthKey; });
      Object.keys(byWorker).forEach(function(wid){
        const w = byWorker[wid];
        const worker = findWorker(wid);
        Object.keys(w.tasks).forEach(function(tid){
          const t = findTask(tid);
          const tk = w.tasks[tid];
          const ppu = (t && t.partsPerUnit) || 1;
          rows.push([worker?worker.name:"Unknown", t?t.name:"(deleted)", tk.made, tk.faults, fmtPct(yieldPct(tk.made,tk.faults,ppu))]);
        });
        rows.push([(worker?worker.name:"Unknown")+" total", "", w.made, w.faults, fmtPct(yieldPct(w.made,w.faults))]);
      });
      const csv = rows.map(function(r){
        return r.map(function(cell){
          const s = String(cell==null?"":cell);
          return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
        }).join(",");
      }).join("\r\n");
      const csvWithBom = "﻿" + csv;
      const filename = "shift-floor-monthly-"+monthKey+(isPartial?"-partial":"")+".csv";
      downloadCsv(filename, csvWithBom);
      showToast("Monthly summary downloaded.");
    }
  };

  function downloadCsv(filename, csvWithBom){
    try {
      const blob = new Blob([csvWithBom], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    } catch(e){
      console.error("Shift Floor: CSV download failed", e);
    }
  }
  window.App = App;

  // Wait for the document to be fully parsed before starting. This guarantees the
  // Firebase bridge <script type="module"> above (which is always deferred by
  // browsers until after parsing completes) has already run and set up
  // window.ShiftFloorDBReady — otherwise init() can race ahead of it and wrongly
  // conclude Firebase is unavailable.
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
