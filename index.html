<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Production</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E7A63">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Production">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#F2F5F0;
    --surface:#FFFFFF;
    --surface-2:#E8EDE3;
    --ink:#151C18;
    --muted:#5D6B61;
    --line:#D7DED2;
    --accent:#0E7A63;
    --accent-ink:#FFFFFF;
    --accent-soft:#DCEEE7;
    --warn:#B8721A;
    --warn-soft:#F6E5CC;
    --bad:#B3402A;
    --bad-soft:#F6DAD3;
    --good:#1C7A50;
    --good-soft:#DCEFE1;
    --shadow: 0 1px 2px rgba(21,28,24,.06), 0 6px 16px rgba(21,28,24,.07);
    --radius: 14px;
    --font-display:'Barlow Semi Condensed','Arial Narrow',sans-serif;
    --font-body:'Public Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1613;
      --surface:#182620;
      --surface-2:#1E2E27;
      --ink:#E8F0EA;
      --muted:#94AB9E;
      --line:#293A31;
      --accent:#41BF9C;
      --accent-ink:#0A1512;
      --accent-soft:#1C3A31;
      --warn:#E1A45B;
      --warn-soft:#3B2C17;
      --bad:#E17E6E;
      --bad-soft:#3B211A;
      --good:#4FCB8C;
      --good-soft:#1A3A28;
      --shadow: 0 1px 2px rgba(0,0,0,.45), 0 10px 26px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1613;
    --surface:#182620;
    --surface-2:#1E2E27;
    --ink:#E8F0EA;
    --muted:#94AB9E;
    --line:#293A31;
    --accent:#41BF9C;
    --accent-ink:#0A1512;
    --accent-soft:#1C3A31;
    --warn:#E1A45B;
    --warn-soft:#3B2C17;
    --bad:#E17E6E;
    --bad-soft:#3B211A;
    --good:#4FCB8C;
    --good-soft:#1A3A28;
    --shadow: 0 1px 2px rgba(0,0,0,.45), 0 10px 26px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
  h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0; letter-spacing:.2px;}
  .num{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  button{font-family:var(--font-body); cursor:pointer;}
  input, select{font-family:var(--font-body);}
  a{color:var(--accent);}
  :focus-visible{outline:3px solid var(--accent); outline-offset:2px;}

  .shell{max-width:1100px;margin:0 auto;padding:18px 18px 48px;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:10px 4px 18px;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:18px;
  }
  .brand-logo{height:34px;width:auto;display:block;}
  .brand-name{font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:.3px;}
  .status-pill{
    font-size:12px; padding:4px 10px; border-radius:999px; background:var(--surface-2); color:var(--muted);
    display:inline-flex; align-items:center; gap:6px; font-weight:600;
  }
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--good);}
  .status-dot.warn{background:var(--warn);}
  .status-dot.bad{background:var(--bad);}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  /* ---- Kiosk / worker flow ---- */
  .kiosk{
    min-height:calc(100vh - 90px);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .kiosk-card{
    width:100%; max-width:460px;
    padding:36px 32px 32px;
    text-align:center;
  }
  .kiosk-eyebrow{
    font-size:13px; font-weight:600; color:var(--accent); text-transform:uppercase; letter-spacing:1.2px; margin-bottom:10px;
  }
  .kiosk-title{font-size:26px; line-height:1.2; margin-bottom:8px;}
  .kiosk-sub{color:var(--muted); font-size:15px; margin-bottom:24px; line-height:1.45;}
  .connect-spinner{
    width:34px; height:34px; margin:6px auto 22px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--accent);
    animation: connectSpin .8s linear infinite;
  }
  @keyframes connectSpin{ to{ transform:rotate(360deg); } }
  .kiosk-body{display:flex; flex-direction:column; gap:14px;}
  select.big, input.big{
    width:100%; font-size:19px; padding:16px 14px; border-radius:12px; border:1.5px solid var(--line);
    background:var(--surface); color:var(--ink);
  }
  input.big{text-align:center; font-family:var(--font-mono); font-weight:600;}
  input.big[type="text"]{font-family:var(--font-body); font-weight:400; text-align:left;}
  /* Worker-mode "how many faulty" input — a red, low-opacity tint that makes the
     transition from the previous (made) question visually obvious, so it isn't mistaken
     for a repeat of the same question. */
  input.big.field-faults{ background:var(--bad-soft); border-color:var(--bad); }
  .btn{
    border:none; border-radius:12px; padding:16px 20px; font-size:17px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  }
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-primary:disabled{opacity:.45; cursor:not-allowed;}
  .btn-ghost{background:var(--surface-2); color:var(--ink);}
  .btn-danger{background:var(--bad-soft); color:var(--bad);}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{flex:1;}
  .link-btn{
    background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline;
    padding:8px; margin-top:6px;
  }
  .task-name-tag{
    display:inline-block; background:var(--accent-soft); color:var(--accent); font-weight:700;
    padding:4px 12px; border-radius:999px; font-size:14px; margin-bottom:2px;
  }
  .confirm-summary{
    text-align:left; background:var(--surface-2); border-radius:12px; padding:14px 16px; font-size:15px;
    display:flex; flex-direction:column; gap:6px; margin-bottom:6px;
  }
  .confirm-summary div{display:flex; justify-content:space-between; gap:10px;}
  .confirm-summary b{font-family:var(--font-mono);}

  /* ---- Notices / messages ---- */
  .banner{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:14px 18px; margin-bottom:12px; background:var(--accent-soft); border:1px solid var(--line);
  }
  .banner span{line-height:1.4;}
  .banner button{flex-shrink:0;}

  /* ---- Manager dashboard ---- */
  .week-banner{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
    padding:16px 20px; margin-bottom:18px;
  }
  .week-banner h2{font-size:22px;}
  .week-banner .sub{color:var(--muted); font-size:14px; margin-top:2px;}
  .toolbar{display:flex; gap:10px; flex-wrap:wrap;}
  .toolbar button{
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:10px 16px; border-radius:10px; font-weight:600; font-size:14px;
  }
  .toolbar button.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent;}

  .overall-row{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px;
  }
  .stat-tile{padding:16px 18px;}
  .stat-tile .label{font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); font-weight:700;}
  .stat-tile .value{font-family:var(--font-mono); font-size:28px; font-weight:600; margin-top:4px;}
  .stat-tile .value.good{color:var(--good);}
  .stat-tile .value.warn{color:var(--warn);}
  .stat-tile .value.bad{color:var(--bad);}

  .section-title{
    font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); font-weight:700;
    margin:26px 4px 12px;
  }
  .task-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px;}
  .task-card{padding:18px 20px;}
  .task-card[draggable="true"]{cursor:grab;}
  .task-card-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .task-card-head h3{font-size:19px;}
  .badge{
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap;
  }
  .badge.good{background:var(--good-soft); color:var(--good);}
  .badge.warn{background:var(--warn-soft); color:var(--warn);}
  .badge.bad{background:var(--bad-soft); color:var(--bad);}
  .badge.idle{background:var(--surface-2); color:var(--muted);}
  .task-metrics{display:flex; gap:18px; margin:14px 0 10px;}
  .task-metric .n{font-family:var(--font-mono); font-size:22px; font-weight:600;}
  .task-metric .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px;}
  .task-recent{
    font-size:13px; color:var(--muted); border-top:1px dashed var(--line); padding-top:10px; margin-top:4px;
  }
  .task-recent b{color:var(--ink); font-family:var(--font-mono);}

  .slot-empty{
    border:2px dashed var(--line); border-radius:var(--radius); padding:24px 16px; text-align:center; color:var(--muted); font-size:14px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:150px;
  }

  table.data-table{width:100%; border-collapse:collapse; font-size:14px;}
  table.data-table th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted);
    padding:8px 10px; border-bottom:1px solid var(--line);
  }
  table.data-table td{padding:10px; border-bottom:1px solid var(--line);}
  table.data-table td.num, table.data-table th.num{text-align:right; font-family:var(--font-mono);}
  .table-wrap{overflow-x:auto;}

  .panel{padding:22px 24px; margin-top:18px;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px; flex-wrap:wrap;}
  .row-form{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px;}
  .row-form input, .row-form select{
    padding:10px 12px; border-radius:9px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); font-size:15px;
  }
  .list-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 4px; border-bottom:1px solid var(--line);
  }
  .list-row:last-child{border-bottom:none;}
  .list-row .name{font-weight:600;}
  .list-row .actions{display:flex; gap:8px; flex-wrap:wrap;}
  .chip-btn{
    border:1px solid var(--line); background:var(--surface-2); border-radius:8px; padding:6px 11px; font-size:12.5px; font-weight:600; color:var(--ink);
  }
  .chip-btn.danger{color:var(--bad); border-color:var(--bad-soft);}
  .chip-btn.chip-active{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
  .inactive-tag{color:var(--muted); font-size:12px; font-style:italic;}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,15,12,.45); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:20;
  }
  .modal{width:100%; max-width:440px; padding:26px 26px 22px; max-height:88vh; overflow-y:auto;}
  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
  .field label{font-size:13px; font-weight:600; color:var(--muted);}

  .footer-note{
    text-align:center; color:var(--muted); font-size:12.5px; margin-top:30px; display:flex; flex-direction:column; gap:6px; align-items:center;
  }
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg);
    padding:12px 20px; border-radius:10px; font-size:14px; font-weight:600; box-shadow:var(--shadow); z-index:40;
    max-width:90vw; text-align:center;
  }
  .input-error{ border-color:var(--bad) !important; background:var(--bad-soft) !important; }
  .list-row[draggable="true"]{ cursor:grab; }
  @media (max-width:640px){
    .task-grid{grid-template-columns:1fr;}
    .overall-row{grid-template-columns:repeat(2,1fr);}
  }

  /* ---- Stand-up meeting overlay ---- */
  .standup-overlay{
    position:fixed; inset:0; z-index:9999; background:#4FC3F7; color:#08222c;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    text-align:center; padding:24px; overflow:hidden;
  }
  .standup-overlay h2{color:#08222c; font-size:clamp(26px,6vw,50px);}
  .standup-timer{
    font-size:clamp(64px,20vw,170px); font-weight:700; color:#08222c; line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .standup-svg{position:absolute; opacity:.4; pointer-events:none;}
  @keyframes standupBlink{ 0%,49%{ background:#4FC3F7; } 50%,100%{ background:#FFFFFF; } }
  .standup-overlay.blinking{ animation: standupBlink 1s steps(1,end) 5; }
</style>
</head>

<div id="app"></div>

<script src="firebase-config.js"></script>
<script type="module">
  // ---- Firebase bridge: exposes window.ShiftFloorDB {subscribe(cb), save(stateObj)} ----
  // and window.ShiftFloorDBReady (a Promise) which the main app script awaits before init().
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { initializeFirestore, persistentLocalCache, getFirestore, doc, onSnapshot, setDoc, collection, addDoc, getDoc, getDocs, deleteDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  window.ShiftFloorDBReady = new Promise(function(resolve){
    try {
      const cfg = window.FIREBASE_CONFIG;
      if (!cfg || !cfg.apiKey || cfg.apiKey === "YOUR_API_KEY") {
        console.warn("Shift Floor: firebase-config.js is not filled in yet — running offline (no shared sync).");
        window.ShiftFloorDB = null;
        resolve(null);
        return;
      }
      const app = initializeApp(cfg);
      let db;
      try {
        // Enable offline persistent local cache so a tablet that briefly loses
        // connectivity (or gets reloaded after being backgrounded) can still read
        // the true last-known state instantly from IndexedDB instead of starting
        // from a blank default — see stateConfirmed handling in the main script.
        db = initializeFirestore(app, { localCache: persistentLocalCache() });
      } catch(e){
        console.warn("Shift Floor: persistent local cache unavailable, falling back to in-memory Firestore.", e);
        db = getFirestore(app);
      }
      const stateRef = doc(db, "shiftfloor", "state");
      // Backup system: every successful save also drops a timestamped snapshot into this
      // separate collection (see persist() in the main script). It never overwrites the
      // live "state" doc above, so a bad save can always be rolled back to a snapshot from
      // before it happened via the manager-facing Backups panel.
      const backupsCol = collection(db, "shiftfloor_backups");

      window.ShiftFloorDB = {
        // cb(stateObjOrNull) — called once with current data (or null if no doc yet exists),
        // then again on every remote change.
        subscribe: function(cb){
          // Second arg to cb: fromCache — true when this snapshot came from the device's
          // local offline cache rather than a confirmed read from the real Firestore server.
          // A from-cache read can be STALE (older than what's really on the server), so the
          // app must never auto-save (persist) anything derived from one — see stateConfirmed/
          // maybePersistMigration handling in the main script. Showing/using it is fine;
          // silently writing it back is not.
          return onSnapshot(stateRef, function(snap){
            const fromCache = !!(snap.metadata && snap.metadata.fromCache);
            if (!snap.exists()) { cb(null, fromCache); return; }
            const data = snap.data();
            try {
              cb(data && data.state ? JSON.parse(data.state) : data, fromCache);
            } catch(e){
              console.error("Shift Floor: failed to parse remote state", e);
              cb(null, fromCache);
            }
          }, function(err){
            console.error("Shift Floor: onSnapshot error", err);
          });
        },
        // save(stateObj) -> Promise
        save: function(stateObj){
          return setDoc(stateRef, { state: JSON.stringify(stateObj), updatedAt: Date.now() });
        },
        // backupSnapshot(stateObj) -> Promise: writes a new, independent timestamped copy
        // of the given state. Fire-and-forget from the main script's perspective — a
        // failed backup should never block or fail the real save.
        backupSnapshot: function(stateObj){
          return addDoc(backupsCol, {
            state: JSON.stringify(stateObj),
            createdAt: Date.now(),
            entryCount: (stateObj && Array.isArray(stateObj.entries)) ? stateObj.entries.length : 0
          });
        },
        // listBackups(max) -> Promise<Array<{id, createdAt, entryCount}>>, newest first.
        // Metadata only (no full state), so listing is cheap even with many snapshots.
        listBackups: function(max){
          return getDocs(query(backupsCol, orderBy("createdAt","desc"), limit(max||500))).then(function(snap){
            return snap.docs.map(function(d){
              const data = d.data();
              return { id: d.id, createdAt: data.createdAt, entryCount: data.entryCount||0 };
            });
          });
        },
        // getBackupState(id) -> Promise<stateObj|null> — the full parsed state for one
        // snapshot. Only fetched when a manager actually restores it.
        getBackupState: function(id){
          return getDoc(doc(db, "shiftfloor_backups", id)).then(function(snap){
            if (!snap.exists()) return null;
            const data = snap.data();
            try { return data.state ? JSON.parse(data.state) : null; } catch(e){ return null; }
          });
        },
        // deleteBackup(id) -> Promise — used by the retention-thinning sweep below.
        deleteBackup: function(id){
          return deleteDoc(doc(db, "shiftfloor_backups", id));
        }
      };
      resolve(window.ShiftFloorDB);
    } catch(e){
      console.error("Shift Floor: Firebase init failed", e);
      window.ShiftFloorDB = null;
      resolve(null);
    }
  });
</script>
<script>

  /* ---------------- utilities ---------------- */
  function uid(prefix){
    return (prefix||"id") + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }
  function slugify(name){
    return "t-" + name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
  }
  function escapeHtml(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function clamp0(n){ n = Math.floor(Number(n)); return isNaN(n) || n < 0 ? 0 : n; }
  // Like clamp0 but keeps a negative value — used for worker self-service
  // correction entries (Fix 2), where "-1" means "subtract one from the running total".
  function toSignedInt(n){ n = Math.trunc(Number(n)); return isNaN(n) ? 0 : n; }
  function pad2(n){ return n < 10 ? "0"+n : ""+n; }
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const DOWS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const MONTHS_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DOWS_LONG = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

  // Date-only ("YYYY-MM-DD") helpers used for entryDate (the day an entry is attributed
  // to) as distinct from ts (the moment it was actually submitted) — see Fix 3.
  function dateOnlyStr(d){
    const x = new Date(d);
    return x.getFullYear()+"-"+pad2(x.getMonth()+1)+"-"+pad2(x.getDate());
  }
  function todayDateOnly(){ return dateOnlyStr(new Date()); }
  // Parses either a date-only string ("YYYY-MM-DD", interpreted as a LOCAL calendar day
  // so it can't shift to the adjacent day under `new Date(str)`'s UTC parsing) or any
  // other date-ish value (ISO timestamp, Date, etc.) via the normal Date constructor.
  function parseDateBasis(d){
    if (typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d)) {
      const parts = d.split("-");
      return new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    }
    return new Date(d);
  }

  function weekStartFor(d){
    const x = parseDateBasis(d);
    x.setHours(0,0,0,0);
    const day = x.getDay();
    const diff = (day - 6 + 7) % 7;
    x.setDate(x.getDate() - diff);
    return x;
  }
  function weekKeyOf(d){
    const s = weekStartFor(d);
    return s.getFullYear()+"-"+pad2(s.getMonth()+1)+"-"+pad2(s.getDate());
  }
  function weekEndFor(startDate){
    const e = new Date(startDate);
    e.setDate(e.getDate()+6);
    e.setHours(23,59,59,999);
    return e;
  }
  function fmtDateShort(d){
    return DOWS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()];
  }
  function fmtRange(start){
    const end = weekEndFor(start);
    const year = end.getFullYear();
    return fmtDateShort(start)+" – "+fmtDateShort(end)+" "+year;
  }
  function fmtRelTime(ts){
    const diffMs = Date.now() - new Date(ts).getTime();
    const m = Math.round(diffMs/60000);
    if (m < 1) return "just now";
    if (m < 60) return m + (m===1?" min ago":" mins ago");
    const h = Math.round(m/60);
    if (h < 24) return h + (h===1?" hour ago":" hours ago");
    const d = Math.round(h/24);
    return d + (d===1?" day ago":" days ago");
  }
  // Heading format for grouping scanned serials by date, e.g. "October 1, 2026 Thursday" —
  // deliberately a different, fuller format than fmtDateShort's abbreviated style, per an
  // explicit request so date-group headings stand out and survive a CSV copy/paste cleanly.
  function fmtSerialDateHeading(d){
    const x = parseDateBasis(d);
    return MONTHS_LONG[x.getMonth()]+" "+x.getDate()+", "+x.getFullYear()+" "+DOWS_LONG[x.getDay()];
  }
  // Every date group gets a heading, including today's — prefixed "Today " so it still
  // reads naturally at a glance, e.g. "Today October 2, 2026 Friday (total 14)".
  function serialGroupHeadingText(dateStr, count){
    const prefix = (dateStr === todayDateOnly()) ? "Today " : "";
    return prefix+fmtSerialDateHeading(dateStr)+" (total "+count+")";
  }
  function fmtPct(n){ return n==null ? "—" : n.toFixed(1)+"%"; }
  function monthKeyOf(d){ const x = parseDateBasis(d); return x.getFullYear()+"-"+pad2(x.getMonth()+1); }
  function monthStartFor(d){ const x = parseDateBasis(d); return new Date(x.getFullYear(), x.getMonth(), 1); }
  function monthEndFor(d){ const x = parseDateBasis(d); return new Date(x.getFullYear(), x.getMonth()+1, 0, 23,59,59,999); }
  function fmtMonthLabel(d){ return MONTHS[d.getMonth()]+" "+d.getFullYear(); }

  // "7000-03+01 003858") with a flexible template system: each entry's `pattern` is a
  // literal string where "X" marks a serial-digit placeholder and every other character
  // (including dashes, "+", and spaces) must match exactly. A scanned/typed serial is valid
  // if it matches ANY configured pattern — one per board type (7000/7010/7020 etc.), fully
  // editable from Settings so the prefix format can be changed to anything in future.
  const DEFAULT_SERIAL_FORMATS = [
    { id:"fmt-7000", label:"7000 board", pattern:"7000-03+01 XXXXXX" },
    { id:"fmt-7010", label:"7010 board", pattern:"7010-03+01 XXXXXX" },
    { id:"fmt-7020", label:"7020 board", pattern:"7020-03+01 XXXXXX" }
  ];
  // Retargets serial scanning from "7000AI PROVISIONING" to "7000AI Final Assy" — a task
  // that already exists in live Firestore data (created earlier via the "other job" alias
  // flow) but isn't in this file's DEFAULT_TASK_NAMES seed list. See migrateState(): this
  // tag is only set once the task is actually found by name, so a client that migrates
  // before that task has synced down keeps retrying on every subsequent load instead of
  // silently giving up.
  const FINAL_ASSY_TASK_NAME = "7000AI Final Assy";
  const FINAL_ASSY_SEED_TAG = "v1-final-assy-serialtask-1";
  const TOUCHUP_PARTS = {

  const MANAGERS_SEED_TAG = "v1-lauren-1";
  const SMT_YIELD_NAMES = ["7000-03+01 BOTTOM INSP/REWORK","7000-03+01 TOP INSP/REWORK","7010-03+01 Power board TOP INSP/REWORK","7020-03+01 Camera board BOT INSP/REWORK","7020-03+01 Camera board TOP INSP/REWORK","4625 Modem Board BOT INSP/REWORK","4625 Modem Board TOP INSP/REWORK","4000-12 CPU BOT INSP/REWORK","4000-12 CPU TOP INSP/REWORK"];
  const THROUGHHOLE_YIELD_NAMES = ["7000-03+01 Main board TOUCH-UP","7010-03+01 Power board TOUCH-UP","7020-03+01 Camera board TOUCH-UP","4625 Modem board TOUCH-UP","4000-12 CPU board TOUCH-UP"];
  const TEST_YIELD_NAMES = ["7000-03+01 Main board TEST","7010-03+01 Power board TEST","7020-03+01 Camera board TEST","4625 SAT Modem Board Test","4000-12 CPU Board Test"];

  // collection flow. Units logged faulty here get cross-checked against scans at Final
  // Assy (see App.addScannedSerial()/faultConfirmPromptBody()).
  const FAULT_BOARD_TASK_NAMES = TEST_YIELD_NAMES.concat(["7000AI PROVISIONING"]);
  // Feature: About panel QR code (points to this app so it can be opened on another
  // tablet/phone) — base64 PNG generated ahead of time, embedded inline as a data URI.
  const ABOUT_QR_B64 = "iVBORw0KGgoAAAANSUhEUgAAAQgAAAEIAQAAAACLjVdSAAABkUlEQVR4nO1YQW7EMBCCKv//Mj0MY3ulSj11FtWbSImTcCAjbPBQ+OX4+g3wQfxjBNQCUY0lqJ78OYXpDOKB/527BjXotylM5+rhWoiiSAjwBQpiOo6gWDOF1M+IGR5vRTx76FlCCGdBUpgO1sN/T4GCyHrUJI8UxOkvr2d/TmE6po81Nyj6juNtCtM5fQgdOWS5SOoPl+mjMhjk2zF/uiopTMcQ6uSFmi+WhlDGG8R0APE4d1EgAZGQlxG/TmE6g+BOo75QdADhhfm0klf9ftWgZLETewrTMQTrrEkiSCSIKs0kjwgE18aNDut8jasxTAf1ARGUQLsvyC2QIKYDiAoZHT06mXUYgS7MHxRBvegDAEDd6i82FW/0O5nZdVOYDq6n6l6QI0fnsVv14WEbjJbt3Jc/nqUG1fZF9l5WRzWH6Vg9Vied6p3MDiE5TOfqsfrrbgntRfW+9eNAUOCSibzORjL9Q8TRX7fteqg7/fbor3vRcJcdbTUpTOfqYYOhM1k9yIkkhul4/ngrjw8iE/ENFL7bvb84SNoAAAAASUVORK5CYII=";
  const COMBO_SEED_TAG = "v1-combos-1";
  const STANDUP_SEED_TAG = "v1-standup-1";
  // One-time recovery for the 2026-09-07 data-loss incident (stale offline-cache
  // snapshot overwrote live Firestore data) — see migrateState() below. Only ever
  // relevant to the already-live production state; a brand-new install has this tag
  // pre-set in buildDefaultState() so it never runs there.
  const RECOVERY_SEED_TAG = "v1-csv-recovery-2026-09-07-1";
  const DEFAULT_STANDUP = { enabled:true, days:[1,2,3,4,5], hour:11, minute:0 };

  function buildDefaultState(){
    function mkTask(name, id){
      return { id:id, name:name, active:true, aliases:[], partsPerUnit: TOUCHUP_PARTS[name.trim().toLowerCase()]||null };
    }
    return {
      managers: [
        { id:"mark", name:"Mark", pin:"1234" },
        { id:"daniel", name:"Daniel Tucker", pin:"1234" },

      ],
      tasks: SMT_TOP_TASK_NAMES.map(function(name,i){ return mkTask(name, slugify(name)+"-smt"+i); })
        .concat(DEFAULT_TASK_NAMES.map(function(name,i){ return mkTask(name, slugify(name)+"-"+i); })),
      workers: DEFAULT_WORKER_NAMES.map(function(name,i){ return { id: "w-"+slugify(name).slice(2)+"-"+i, name:name, active:true }; }),
      entries: [],
      pendingRequests: [],
      workerMessages: [],
      managerNotices: [],
      notices: [],
      assignments: [],
      combos: [],
      headlineTaskId: null,
      serialTaskId: null,
      serials: [],
      serialFormats: DEFAULT_SERIAL_FORMATS.map(function(f){ return Object.assign({}, f); }),
      finalAssySeedTag: null,
      reassignUntil: null,
      seedTag: null,
      workerSeedTag: null,
      smtSeedTag: SMT_SEED_TAG,
      comboSeedTag: null,
      ppuSeedTag: null,
      managersSeedTag: MANAGERS_SEED_TAG,
      faultBoards: [],
      standup: Object.assign({}, DEFAULT_STANDUP),
      standupSeedTag: STANDUP_SEED_TAG,
      recoverySeedTag: RECOVERY_SEED_TAG
    };
  }

  /* ---------------- state ---------------- */
  let STATE = null;
  let dbApi = null;
  let saveStatus = "idle";
  // Becomes true only once we truly know the real state — either Firestore confirmed
  // real data, or Firestore confirmed the document genuinely doesn't exist yet (brand
  // new setup). Until then, render() must show a "connecting" screen, never the
  // default/blank dashboard, so a stray persist() can never overwrite real data with
  // defaults. See init()/render() below.
  let stateConfirmed = false;
  let connectFailed = false;
  let ui = { screen: null };
  let toastMsg = null, toastTimer = null;
  let standupOverlayState = null; // { phase:'countdown'|'blinking'|'holding', occTs:Number, secondsLeft:Number }
  let standupClockTimer = null;

  function getDeviceMode(){ try { return localStorage.getItem("td_deviceMode"); } catch(e){ return null; } }
  function setDeviceMode(m){ try { localStorage.setItem("td_deviceMode", m); } catch(e){} }
  function getAssignedWorkerId(){ try { return localStorage.getItem("td_assignedWorkerId"); } catch(e){ return null; } }
  function setAssignedWorkerId(id){

  function setMgrIdentity(id){

  function mgrKey(base){ return base + "_" + (getMgrIdentity() || "guest"); }
  function getPriorityPins(){
    try { const raw = localStorage.getItem(mgrKey("td_priorityPins")); return raw ? JSON.parse(raw) : [null,null,null,null]; } catch(e){ return [null,null,null,null]; }
  }
  function setPriorityPins(arr){ try { localStorage.setItem(mgrKey("td_priorityPins"), JSON.stringify(arr)); } catch(e){} }
  function isPriorityCollapsed(){ try { return localStorage.getItem(mgrKey("td_priorityCollapsed"))==="1"; } catch(e){ return false; } }
  function setPriorityCollapsed(v){ try { localStorage.setItem(mgrKey("td_priorityCollapsed"), v?"1":"0"); } catch(e){} }
  function isSerialsCollapsed(){ try { return localStorage.getItem(mgrKey("td_serialsCollapsed"))==="1"; } catch(e){ return false; } }
  function setSerialsCollapsed(v){ try { localStorage.setItem(mgrKey("td_serialsCollapsed"), v?"1":"0"); } catch(e){} }
  // Worker-scoped (per assigned-worker-id, mirroring mgrKey) collapse state for the two new
  // worker-home panels: pinned task shortcuts and "My Entries".
  function workerKey(base){ return base + "_" + (getAssignedWorkerId() || "guest"); }
  function isShortcutsCollapsed(){ try { return localStorage.getItem(workerKey("td_shortcutsCollapsed"))==="1"; } catch(e){ return false; } }
  function setShortcutsCollapsed(v){ try { localStorage.setItem(workerKey("td_shortcutsCollapsed"), v?"1":"0"); } catch(e){} }
  function isMyEntriesCollapsed(){ try { return localStorage.getItem(workerKey("td_myEntriesCollapsed"))==="1"; } catch(e){ return false; } }
  function setMyEntriesCollapsed(v){ try { localStorage.setItem(workerKey("td_myEntriesCollapsed"), v?"1":"0"); } catch(e){} }
  function isYieldCollapsed(){ try { return localStorage.getItem(mgrKey("td_yieldCollapsed"))==="1"; } catch(e){ return false; } }
  function setYieldCollapsed(v){ try { localStorage.setItem(mgrKey("td_yieldCollapsed"), v?"1":"0"); } catch(e){} }
  function isReassignOpen(){ return !!(STATE && STATE.reassignUntil && new Date(STATE.reassignUntil).getTime() > Date.now()); }
  function ackGet(key){ try { return JSON.parse(localStorage.getItem(key)||"[]"); } catch(e){ return []; } }
  function ackAdd(key,id){

    if (arr.indexOf(id)===-1){ arr.push(id); try{ localStorage.setItem(key, JSON.stringify(arr)); }catch(e){} }

  function getStandupAckedAt(){

  function showToast(msg){

  /* ---------------- migration ---------------- */
  function migrateState(){
    let changed = false;
    if (!STATE.tasks) { STATE.tasks = []; changed = true; }
    STATE.tasks.forEach(function(t){
      if (!t.aliases) { t.aliases = []; changed = true; }
      if (typeof t.active !== "boolean") { t.active = true; changed = true; }
    });
    if (!STATE.workers) { STATE.workers = []; changed = true; }
    // Worker shortcut pins (up to 3 tasks, manually pinned by the worker from the task
    // picker) — see pickTaskBody()/toggleWorkerTaskPin().
    STATE.workers.forEach(function(w){
      if (!Array.isArray(w.pinnedTasks)) { w.pinnedTasks = []; changed = true; }
    });
    if (!STATE.entries) { STATE.entries = []; changed = true; }
    STATE.entries.forEach(function(e){
      // Fix 3 (backdating): every entry needs a date-only entryDate it's attributed to,
      // separate from ts (the real submission moment). Backfill it from ts for any
      // entry created before this feature existed.
      if (!e.entryDate) { e.entryDate = dateOnlyStr(e.ts || Date.now()); changed = true; }
    });
    if (!STATE.pendingRequests) { STATE.pendingRequests = []; changed = true; }
    if (!STATE.workerMessages) { STATE.workerMessages = []; changed = true; }
    if (!STATE.notices) { STATE.notices = []; changed = true; }
    if (!STATE.assignments) { STATE.assignments = []; changed = true; }
    if (!STATE.managers || !STATE.managers.length) {
      const legacyPin = STATE.pin || "1234";
      STATE.managers = [
        { id:"mark", name:"Mark", pin: legacyPin },
        { id:"daniel", name:"Daniel Tucker", pin:"1234" }
      ];
      changed = true;
    }
    if (STATE.pin !== undefined) { delete STATE.pin; changed = true; }
    // Feature: add Lauren as a third manager (allow-listed, read-only like Daniel on the
    // touch-up parts-per-unit fields — see managerSettingsPanel's isMark check). Seed-
    // tagged so this runs exactly once against already-deployed state without re-running
    // any other already-completed seed-tag block above/below.
    if (STATE.managersSeedTag !== MANAGERS_SEED_TAG) {
      const hasLauren = (STATE.managers||[]).some(function(m){ return m.id === "lauren"; });
      if (!hasLauren) STATE.managers.push({ id:"lauren", name:"Lauren", pin:"1234" });
      STATE.managersSeedTag = MANAGERS_SEED_TAG;
      changed = true;
    }
    if (!STATE.faultBoards) { STATE.faultBoards = []; changed = true; }
    if (STATE.priorityTaskIds !== undefined) { delete STATE.priorityTaskIds; changed = true; }
    if (!STATE.managerNotices) { STATE.managerNotices = []; changed = true; }
    if (STATE.reassignUntil === undefined) { STATE.reassignUntil = null; changed = true; }
    if (!STATE.combos) { STATE.combos = []; changed = true; }

    if (STATE.comboSeedTag !== COMBO_SEED_TAG) {
      // The 3 built-in yield groups (SMT/Through-hole/Test) are always-on and computed
      // directly from SMT_YIELD_NAMES/THROUGHHOLE_YIELD_NAMES/TEST_YIELD_NAMES — they are
      // NOT stored as user combos. STATE.combos only holds manager-created custom groups.
      if (!STATE.combos) STATE.combos = [];
      STATE.comboSeedTag = COMBO_SEED_TAG;
      changed = true;
    }
    [SMT_YIELD_NAMES, THROUGHHOLE_YIELD_NAMES, TEST_YIELD_NAMES].forEach(function(list){
      list.forEach(function(name){
        const key = name.trim().toLowerCase();
        const found = STATE.tasks.some(function(t){ return t.name.trim().toLowerCase() === key; });
        if (!found) console.warn('Yield group task name did not resolve to any task: "'+name+'"');
      });
    });

    if (STATE.ppuSeedTag !== PPU_SEED_TAG) {
      STATE.tasks.forEach(function(t){
        if (t.partsPerUnit === undefined) {
          const key = t.name.trim().toLowerCase();
          if (Object.prototype.hasOwnProperty.call(TOUCHUP_PARTS, key)) t.partsPerUnit = TOUCHUP_PARTS[key];
        }
      });
      STATE.ppuSeedTag = PPU_SEED_TAG;
      changed = true;
    }

    if (STATE.seedTag !== SEED_TAG) {
      const existing = {};
      STATE.tasks.forEach(function(t){ existing[t.name.trim().toLowerCase()] = true; });
      DEFAULT_TASK_NAMES.forEach(function(name,i){
        const key = name.trim().toLowerCase();
        if (!existing[key]) {
          STATE.tasks.push({ id: slugify(name)+"-new"+i, name:name, active:true, aliases:[] });
          existing[key] = true;
        }
      });
      STATE.seedTag = SEED_TAG;
      changed = true;
    }
    if (!STATE.headlineTaskId || !findTask(STATE.headlineTaskId)) {
      const headline = STATE.tasks.find(function(t){ return t.name.trim().toLowerCase() === "7000ai provisioning"; });
      if (headline) { STATE.headlineTaskId = headline.id; changed = true; }
    }
    if (!STATE.serials) { STATE.serials = []; changed = true; }
    // Feature 4 (weekly pending-serials tracking): every serial row needs a date-only
    // entryDate it's attributed to, same idea as entries' entryDate. Backfill any row
    // created before this feature existed from its ts.
    STATE.serials.forEach(function(s){
      if (!s.entryDate) { s.entryDate = dateOnlyStr(s.ts || Date.now()); changed = true; }
    });
    // Feature 1 (serial scanning task): "7000AI Final Assy" is the permanent home for
    // serial scanning, and its own default task now (bottom of DEFAULT_TASK_NAMES) — but
    // this check deliberately does NOT gate on a one-time seed tag. It runs on every
    // migrateState() call, so if this task (or the serialTaskId pointer to it) is ever
    // wiped again by a future sync/data-loss incident, it keeps fixing itself on the next
    // load instead of needing another manual rebuild. Task data itself (made/faults
    // history) is never reconstructed here — only the task's existence and its wiring as
    // the serial-scan target.
    let finalAssyTask = findTaskByNameOrAlias(FINAL_ASSY_TASK_NAME);
    if (!finalAssyTask) {
      finalAssyTask = { id: slugify(FINAL_ASSY_TASK_NAME)+"-final-assy", name: FINAL_ASSY_TASK_NAME, active:true, aliases:[] };
      STATE.tasks.push(finalAssyTask);
      changed = true;
    }
    if (STATE.serialTaskId !== finalAssyTask.id) {
      STATE.serialTaskId = finalAssyTask.id;
      changed = true;
    }
    if (STATE.finalAssySeedTag !== FINAL_ASSY_SEED_TAG) {
      STATE.finalAssySeedTag = FINAL_ASSY_SEED_TAG;
      changed = true;
    }
    // Replaces the old single digits-only/prefix serialFormat with an array of per-board-
    // type literal+"X" templates (see DEFAULT_SERIAL_FORMATS above). Any pre-existing
    // STATE.serialFormat from before this change is simply dropped — it was built on an
    // assumption (plain numeric serials) that didn't match real board serials anyway.
    if (!Array.isArray(STATE.serialFormats) || !STATE.serialFormats.length) {
      STATE.serialFormats = DEFAULT_SERIAL_FORMATS.map(function(f){ return Object.assign({}, f); });
      changed = true;
    }
    if (STATE.serialFormat !== undefined) { delete STATE.serialFormat; changed = true; }

    if (STATE.smtSeedTag !== SMT_SEED_TAG) {
      const existingSmt = {};
      STATE.tasks.forEach(function(t){ existingSmt[t.name.trim().toLowerCase()] = true; });
      const toPrepend = [];
      SMT_TOP_TASK_NAMES.forEach(function(name,i){
        const key = name.trim().toLowerCase();
        if (!existingSmt[key]) {
          toPrepend.push({ id: slugify(name)+"-smtnew"+i, name:name, active:true, aliases:[] });
          existingSmt[key] = true;
        }
      });
      if (toPrepend.length) STATE.tasks = toPrepend.concat(STATE.tasks);
      STATE.smtSeedTag = SMT_SEED_TAG;
      changed = true;
    }

    if (STATE.workerSeedTag !== WORKER_SEED_TAG) {
      const existingW = {};
      STATE.workers.forEach(function(w){ existingW[w.name.trim().toLowerCase()] = true; });
      DEFAULT_WORKER_NAMES.forEach(function(name,i){
        const key = name.trim().toLowerCase();
        if (!existingW[key]) {
          STATE.workers.push({ id:"w-"+slugify(name).slice(2)+"-new"+i, name:name, active:true });
          existingW[key] = true;
        }
      });
      const sample = STATE.workers.find(function(w){ return w.name.trim().toLowerCase() === "sample worker"; });
      if (sample && sample.active) sample.active = false;
      STATE.workerSeedTag = WORKER_SEED_TAG;
      changed = true;
    }

    if (STATE.standupSeedTag !== STANDUP_SEED_TAG) {
      if (!STATE.standup) STATE.standup = Object.assign({}, DEFAULT_STANDUP);
      STATE.standupSeedTag = STANDUP_SEED_TAG;
      changed = true;
    }
    if (!STATE.standup) { STATE.standup = Object.assign({}, DEFAULT_STANDUP); changed = true; }
    if (!Array.isArray(STATE.standup.days)) { STATE.standup.days = DEFAULT_STANDUP.days.slice(); changed = true; }
    if (typeof STATE.standup.hour !== "number") { STATE.standup.hour = DEFAULT_STANDUP.hour; changed = true; }
    if (typeof STATE.standup.minute !== "number") { STATE.standup.minute = DEFAULT_STANDUP.minute; changed = true; }
    if (typeof STATE.standup.enabled !== "boolean") { STATE.standup.enabled = DEFAULT_STANDUP.enabled; changed = true; }

    // One-time recovery (2026-09-07 data-loss incident): a device's stale offline
    // Firestore cache got treated as confirmed state and auto-saved over the real,
    // newer data on the server (fixed in the subscribe/fromCache handling above, but
    // that fix can't bring back what was already overwritten). This reconstructs the
    // lost TOTALS — not the original per-submission entries, which are gone for good —
    // from a Shift Floor Monthly Summary CSV the user exported before the incident
    // (covering Sep 2026 through 2026-09-07). For each worker+task pair below, it tops
    // up whatever survived the incident to match the CSV's recorded total, via a single
    // "recovered" catch-up entry sized to the shortfall — so anything that DID survive
    // is never double-counted. Retries on every load (like FINAL_ASSY_SEED_TAG above)
    // until every row can be resolved, in case a device runs this before its local task/
    // worker lists have synced down.
    if (STATE.recoverySeedTag !== RECOVERY_SEED_TAG) {
      const RECOVERY_MONTH = "2026-09";
      const RECOVERY_DATE = "2026-09-07";
      const RECOVERY_ROWS = [
        ["Rocky", "7020-03+01 CAM BOT (SMT)", 248, 0],
        ["Rocky", "7020-03+01 CAM TOP (SMT)", 373, 0],
        ["Hen", "7000-03+01 Main board TOUCH-UP", 74, 693],
        ["Hen", "7010-03+01 Power board TOUCH-UP", 25, 0],
        ["Dennis", "7000AI PROVISIONING", 28, 9],
        // Kim / 7000AI Final Assy intentionally excluded — that task and its serial data
        // were lost entirely; the user is re-entering those manually rather than having
        // this auto-inject a catch-up total for it.
        ["Bao", "7010-03+01 Power board TEST", 25, 0],
        ["Bao", "7000-03+01 Main board TEST", 54, 1],
        ["Bao", "7020-03+01 Camera board TEST", 24, 0],
        ["Phung", "7000-03+01 Mainboard BOT SELECTIVE", 127, 0],
        ["Phung", "7000-03+01 Mainboard TOP SELECTIVE", 70, 0],
        ["Phung", "7000-03+01 TOP INSP/REWORK", 50, 0],
        ["Phung", "7020-03+01 Camera board TOP INSP/REWORK", 168, 0]
      ];
      let recoveryAllResolved = true;
      RECOVERY_ROWS.forEach(function(row){
        const workerName = row[0], taskName = row[1], targetMade = row[2], targetFaults = row[3];
        const worker = STATE.workers.find(function(w){ return w.name.trim().toLowerCase() === workerName.trim().toLowerCase(); });
        const task = findTaskByNameOrAlias(taskName);
        if (!worker || !task) { recoveryAllResolved = false; return; }
        let curMade = 0, curFaults = 0;
        STATE.entries.forEach(function(e){
          if (e.workerId === worker.id && e.taskId === task.id && monthKeyOf(e.entryDate) === RECOVERY_MONTH) {
            curMade += e.made; curFaults += e.faults;
          }
        });
        const deficitMade = Math.max(0, targetMade - curMade);
        const deficitFaults = Math.max(0, targetFaults - curFaults);
        if (deficitMade > 0 || deficitFaults > 0) {
          STATE.entries.push({
            id: uid("e"),
            workerId: worker.id,
            taskId: task.id,
            made: deficitMade,
            faults: deficitFaults,
            ts: RECOVERY_DATE + "T12:00:00.000Z",
            entryDate: RECOVERY_DATE,
            by: worker.id,
            enteredByManager: null,
            // Marks this as a synthetic catch-up entry from the CSV recovery rather than
            // a real submission — available for a future "Recovered from backup" label,
            // same idea as the existing enteredByManager attribution.
            recovered: true
          });
          changed = true;
        }
      });
      if (recoveryAllResolved) {
        STATE.recoverySeedTag = RECOVERY_SEED_TAG;
        changed = true;
      }
    }

    return changed;
  }

  /* ---------------- standup meeting reminder ---------------- */
  function computeStandupOverlay(){
    if (!STATE || !STATE.standup || !STATE.standup.enabled) return null;
    const cfg = STATE.standup;
    const now = new Date();
    const dow = now.getDay();
    if ((cfg.days||[]).indexOf(dow) === -1) return null;
    const occ = new Date(now.getFullYear(), now.getMonth(), now.getDate(), cfg.hour||0, cfg.minute||0, 0, 0);
    const occTs = occ.getTime();
    const nowTs = now.getTime();
    const dayEndTs = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999).getTime();
    const ackedAt = getStandupAckedAt();
    if (ackedAt && ackedAt >= occTs) return null; // this occurrence already acknowledged on this device
    if (nowTs < occTs - 60000) return null; // more than 1 minute before — nothing to show yet
    if (nowTs > dayEndTs) return null; // stale — day has ended, wait for the next scheduled occurrence
    if (nowTs < occTs) {
      return { phase:"countdown", occTs:occTs, secondsLeft: Math.max(1, Math.ceil((occTs - nowTs)/1000)) };
    }
    const elapsed = nowTs - occTs;
    if (elapsed < 5000) return { phase:"blinking", occTs:occTs };
    return { phase:"holding", occTs:occTs };
  }
  function standupStateKey(s){
    return s ? (s.phase+":"+s.occTs+":"+(s.secondsLeft||0)) : "none";
  }
  function startStandupClock(){
    if (standupClockTimer) return;
    standupClockTimer = setInterval(function(){
      const next = computeStandupOverlay();
      if (standupStateKey(next) !== standupStateKey(standupOverlayState)) {
        standupOverlayState = next;
        render();
      }
    }, 1000);
  }
  function standupOverlayHtml(){
    const s = standupOverlayState;
    if (!s) return "";
    const decor =
      '<svg class="standup-svg" style="top:18px;left:18px;width:70px;height:70px;" viewBox="0 0 100 100" aria-hidden="true">'+
        '<g fill="none" stroke="#08222c" stroke-width="4">'+
          '<circle cx="50" cy="50" r="22"/>'+
          '<circle cx="50" cy="50" r="8" fill="#08222c"/>'+
          '<g>'+[0,45,90,135,180,225,270,315].map(function(a){
            return '<rect x="47" y="6" width="6" height="16" rx="2" transform="rotate('+a+' 50 50)"/>';
          }).join("")+'</g>'+
        '</g>'+
      '</svg>'+
      '<svg class="standup-svg" style="bottom:18px;right:18px;width:80px;height:80px;" viewBox="0 0 100 100" aria-hidden="true">'+
        '<g fill="none" stroke="#08222c" stroke-width="4">'+
          '<circle cx="50" cy="50" r="16"/>'+
          '<circle cx="50" cy="50" r="6" fill="#08222c"/>'+
          '<g>'+[0,60,120,180,240,300].map(function(a){
            return '<rect x="47" y="4" width="6" height="14" rx="2" transform="rotate('+a+' 50 50)"/>';
          }).join("")+'</g>'+
        '</g>'+
      '</svg>'+
      '<svg class="standup-svg" style="bottom:24px;left:6%;width:34%;height:36px;" viewBox="0 0 300 40" preserveAspectRatio="none" aria-hidden="true">'+
        '<g fill="none" stroke="#08222c" stroke-width="4">'+
          '<line x1="0" y1="20" x2="300" y2="20"/>'+
          '<line x1="0" y1="30" x2="300" y2="30"/>'+
          [0,30,60,90,120,150,180,210,240,270,300].map(function(x){
            return '<line x1="'+x+'" y1="20" x2="'+x+'" y2="30"/>';
          }).join("")+
        '</g>'+
      '</svg>'+
      '<svg class="standup-svg" style="top:8%;right:6%;width:30%;height:60px;" viewBox="0 0 220 60" preserveAspectRatio="none" aria-hidden="true">'+
        '<g fill="none" stroke="#08222c" stroke-width="3">'+
          '<path d="M0 30 H60 V10 H140 V50 H220"/>'+
          '<circle cx="60" cy="30" r="4" fill="#08222c" stroke="none"/>'+
          '<circle cx="140" cy="10" r="4" fill="#08222c" stroke="none"/>'+
          '<circle cx="140" cy="50" r="4" fill="#08222c" stroke="none"/>'+
        '</g>'+
      '</svg>';

    if (s.phase === "countdown") {
      const m = Math.floor(s.secondsLeft/60), sec = s.secondsLeft%60;
      const clock = (m>0 ? (m+":"+pad2(sec)) : String(sec));
      return (
        '<div class="standup-overlay">'+decor+
          '<div class="kiosk-eyebrow" style="color:#08222c;">Coming up</div>'+
          '<h2>Stand-up Meeting</h2>'+
          '<div class="standup-timer num">'+clock+'</div>'+
          '<div style="color:#08222c;font-size:16px;">starting in the workshop — head over now</div>'+
        '</div>'
      );
    }
    if (s.phase === "blinking") {
      return (
        '<div class="standup-overlay blinking">'+decor+
          '<h2>Stand-up Meeting</h2>'+
          '<div class="standup-timer num">NOW</div>'+
        '</div>'
      );
    }
    // holding
    return (
      '<div class="standup-overlay">'+decor+
        '<h2 style="font-size:clamp(30px,7vw,58px);">Stand-up Meeting — Now</h2>'+
        '<div style="color:#08222c;font-size:17px;max-width:420px;">Head to the meeting point. Tap below once you’ve seen this.</div>'+
        '<button class="btn btn-primary" style="width:auto;padding:18px 34px;background:#08222c;color:#fff;" onclick="App.ackStandup()">Acknowledge</button>'+
      '</div>'
    );
  }

  let firstSnapshot = true;
  let applyingRemote = false;
  // Glitch fix: a remote update from ANY other tablet/dashboard triggers a full re-render
  // on every OTHER open device via dbApi.subscribe() below — including one that's sitting
  // mid-typing on an unrelated screen (classically, the manager PIN input, or scrolled
  // partway down a list). When this flag is set around such a background render(), the
  // currently-focused input's value/caret and any tagged scrollable container's scroll
  // position are preserved across the DOM rebuild instead of being wiped/reset, and the
  // usual "auto-select the primary input" behavior (focusPrimaryInput) is skipped so it
  // can't also steal the selection out from under whatever the user is actively typing.
  let suppressFocusSteal = false;

  async function init(){
    loadUi();
    STATE = buildDefaultState();
    migrateState();
    standupOverlayState = computeStandupOverlay();
    render();
    startStandupClock();

    try {
      dbApi = await Promise.race([
        window.ShiftFloorDBReady || Promise.resolve(null),
        new Promise(function(resolve){ setTimeout(function(){ resolve(null); }, 10500); })
      ]);
    } catch(e){ dbApi = null; }

    if (!dbApi) {
      // We have no way to know whether real data exists in Firestore, so we must
      // NOT assume it's safe to show/seed the blank default state. Stay unconfirmed
      // and show the "can't connect" screen instead of the normal UI.
      saveStatus = "offline";
      connectFailed = true;
      render();
      return;
    }

    dbApi.subscribe(function(remoteState, fromCache){
      // fromCache: true means this snapshot is the device's own local (possibly stale/older)
      // cached copy, not a confirmed read from the real Firestore server. Showing/using it is
      // fine (that's the whole point of the offline cache), but auto-saving anything derived
      // from it is NOT — a stale cached snapshot can be older than what's really on the server,
      // and blindly writing it back (e.g. after migrateState() "fixes" it) would silently erase
      // any real data added since that cache was last refreshed. Only maybePersistMigration()
      // is allowed to auto-save, and only once we've seen a server-confirmed (!fromCache) read.
      function maybePersistMigration(changed){
        if (changed && !fromCache) persist(true);
      }
      if (firstSnapshot) {
        firstSnapshot = false;
        if (remoteState) {
          STATE = remoteState;
          const changed = migrateState();
          stateConfirmed = true;
          saveStatus = "saved";
          render();
          maybePersistMigration(changed);
        } else if (!fromCache) {
          // First run: Firestore's SERVER confirmed the document truly doesn't exist yet —
          // legitimate brand-new setup. Safe to seed defaults. (A from-cache "doesn't exist"
          // just means this device has never synced before, NOT that the server is empty —
          // stay unconfirmed and wait for the real server read instead of seeding/persisting.)
          migrateState();
          stateConfirmed = true;
          persist(true);
        }
        return;
      }
      // Live update from another tablet/dashboard (or this device catching up from cache to
      // the real server state). This render() can land at any moment, including mid-
      // keystroke on an unrelated screen on THIS device — suppressFocusSteal (see above)
      // keeps it from clobbering whatever the user here is actively doing.
      applyingRemote = true;
      STATE = remoteState || STATE;
      const changed = migrateState();
      stateConfirmed = true;
      saveStatus = "saved";
      suppressFocusSteal = true;
      render();
      suppressFocusSteal = false;
      applyingRemote = false;
      maybePersistMigration(changed);
    });
  }

  let persistTimer = null, retryTimer = null, retryCount = 0;
  // Backup system (client-side snapshot-on-save): after every successful save, a copy of
  // the just-saved state is also dropped into a separate Firestore collection (never the
  // live "state" doc), so there's always a rollback point from before whatever happens
  // next. See dbApi.backupSnapshot()/listBackups()/getBackupState()/deleteBackup() in the
  // Firebase bridge module above, and managerBackupsPanel()/App.restoreBackup() below.
  let backupsListCache = null;      // null until first loaded this session
  let backupsListLoading = false;
  let backupsListError = null;
  let backupsPrunedThisSession = false;
  // Retention: keep every snapshot from the last 2 days in full; thin anything older than
  // that down to one per calendar day, up to 30 days back; delete anything older still.
  // Runs at most once per browser session (triggered when the Backups panel is opened),
  // not on every save — thinning a few extra full-granularity snapshots for a while is
  // harmless, so there's no need to run this on every single submission.
  function pruneOldBackups(){
    if (backupsPrunedThisSession || !dbApi || !dbApi.listBackups || !dbApi.deleteBackup) return;
    backupsPrunedThisSession = true;
    const FULL_MS = 2*24*3600*1000;
    const DAILY_CUTOFF_MS = 30*24*3600*1000;
    const now = Date.now();
    dbApi.listBackups(1000).then(function(list){
      const toDelete = [];
      const keepForDay = {};
      list.forEach(function(b){
        const age = now - b.createdAt;
        if (age <= FULL_MS) return;
        if (age > DAILY_CUTOFF_MS) { toDelete.push(b.id); return; }
        const day = dateOnlyStr(b.createdAt);
        const kept = keepForDay[day];
        if (!kept || b.createdAt > kept.createdAt) {
          if (kept) toDelete.push(kept.id);
          keepForDay[day] = b;
        } else {
          toDelete.push(b.id);
        }
      });
      toDelete.forEach(function(id){
        dbApi.deleteBackup(id).catch(function(e){ console.warn("Shift Floor: failed to prune old backup", id, e); });
      });
    }).catch(function(e){ console.warn("Shift Floor: backup pruning skipped (couldn't list backups)", e); });
  }
  function loadBackupsList(){
    if (!dbApi || !dbApi.listBackups) { backupsListError = "Not connected — can't load backups right now."; render(); return; }
    backupsListLoading = true;
    backupsListError = null;
    render();
    dbApi.listBackups(500).then(function(list){
      backupsListCache = list;
      backupsListLoading = false;
      render();
      pruneOldBackups();
    }).catch(function(e){
      console.error("Shift Floor: failed to load backups list", e);
      backupsListLoading = false;
      backupsListError = "Couldn't load backups — check connection and try again.";
      render();
    });
  }
  function scheduleRetry(){
    if (retryCount >= 3) return;
    retryCount++;
    clearTimeout(retryTimer);
    retryTimer = setTimeout(function(){ persist(true); }, 6000*retryCount);
  }
  function persist(silent, successMsg, failMsg){
    if (!stateConfirmed) {
      // Safety net: never let a stray save path write default/unconfirmed state
      // over whatever is really in Firestore before we've confirmed what that is.
      console.warn("Shift Floor: persist() called before state was confirmed — ignoring.");
      return;
    }
    if (!dbApi) {
      saveStatus = "offline";
      if (failMsg) showToast(failMsg);
      if (!silent) render();
      return;
    }
    saveStatus = "saving";
    if (!silent) render();
    clearTimeout(persistTimer);
    persistTimer = setTimeout(async function(){
      try {
        await dbApi.save(STATE);
        saveStatus = "saved";
        retryCount = 0;
        if (successMsg) showToast(successMsg);
        render();
        // Fire-and-forget: a failed backup snapshot should never affect the real save's
        // success/failure or the UI — it's purely an extra safety copy on the side.
        if (dbApi.backupSnapshot) {
          dbApi.backupSnapshot(STATE).catch(function(e){ console.warn("Shift Floor: backup snapshot failed", e); });
        }
      } catch(err){
        saveStatus = "offline";
        if (failMsg) showToast(failMsg);
        scheduleRetry();
        render();
      }
    }, 150);
  }

  /* ---------------- data helpers ---------------- */
  function activeTasks(){ return STATE.tasks.filter(function(t){ return t.active; }); }
  function activeWorkers(){ return STATE.workers.filter(function(w){ return w.active; }); }
  function findTask(id){ return STATE.tasks.find(function(t){ return t.id===id; }); }
  function findWorker(id){ return STATE.workers.find(function(w){ return w.id===id; }); }

  /* ---------------- Fault Log traceability (Feature: test-task fault boards) ---------------- */
  const FAULT_STATUS_LABELS = { for_repair:"For Repair", received:"Received", passed:"Passed", set_aside:"Set Aside" };
  function faultStatusBadgeClass(status){
    if (status === "passed") return "good";
    if (status === "received") return "warn";
    if (status === "set_aside") return "idle";
    return "bad"; // for_repair
  }
  function findFaultBoardBySerial(serial){
    const key = (serial||"").trim();
    if (!key) return null;
    return (STATE.faultBoards||[]).find(function(b){ return b.serial === key; }) || null;
  }
  function faultBoardHistoryHtml(board){
    const rows = (board.history||[]).slice().reverse().map(function(h){
      return '<div class="list-row"><div><div>'+escapeHtml(FAULT_STATUS_LABELS[h.status]||h.status)+
        (h.desc?(' — '+escapeHtml(h.desc)):'')+(h.job?(' · Job '+escapeHtml(h.job)):'')+(h.notes?(' — '+escapeHtml(h.notes)):'')+'</div>'+
        '<div style="font-size:12px;color:var(--muted);">'+escapeHtml(h.entryDate||"")+' · '+escapeHtml(h.by||"")+'</div></div></div>';
    }).join("");
    return '<div style="text-align:left;margin-top:10px;"><div class="section-title" style="margin:10px 0 4px;">History</div>'+rows+'</div>';
  }
  // A serial matches a template when it's the same length and every character lines up
  // with the pattern's literal characters exactly, except where the pattern has "X" —
  // those positions just need to be a single digit. Dashes, "+", spaces, letters, etc. in
  // the pattern are literal and must match exactly (case-sensitive).
  function matchesSerialPattern(raw, pattern){
    if (raw.length !== pattern.length) return false;
    for (let i=0; i<pattern.length; i++) {
      const pc = pattern[i], rc = raw[i];
      if (pc === "X") { if (!/[0-9]/.test(rc)) return false; }
      else if (pc !== rc) return false;
    }
    return true;
  }
  function validateSerialFormat(raw){
    const formats = (Array.isArray(STATE.serialFormats) && STATE.serialFormats.length) ? STATE.serialFormats : DEFAULT_SERIAL_FORMATS;
    const ok = formats.some(function(f){ return matchesSerialPattern(raw, f.pattern || ""); });
    if (ok) return null;
    const examples = formats.map(function(f){ return f.pattern; }).join(" or ");
    return "Wrong format — must match "+examples+" (X = any digit).";
  }
  function focusSelectSerialInput(clearValue){
    setTimeout(function(){
      const el = document.getElementById("serialInput");
      if (!el) return;
      el.focus();
      if (clearValue) el.value = "";
      else el.select();
    }, 0);
  }
  /* ---------------- Feature 2: camera barcode scanning ---------------- */
  // Dependency-free: uses the browser's native BarcodeDetector API only (feature-detected
  // below), no bundled/polyfill library. Lives entirely outside the render()/innerHTML
  // cycle — its modal is appended straight to document.body and updated with direct DOM
  // writes — so the live <video> element is never torn down by a normal app re-render
  // while a scan session is open. Strictly additive: every detected barcode is fed through
  // the SAME manual-entry function (App.addScannedSerial or App.addSerialManual) that a
  // typed serial would use, so validation/dedup/format-checking is never duplicated, and
  // if the camera can't be used at all the manual type/paste path is completely unaffected.
  let cameraScan = null; // { stream, rafId, lastCode, lastCodeAt, opts, modalEl }
  function closeCameraScan(){
    if (!cameraScan) return;
    const cs = cameraScan;
    cameraScan = null; // clear first so any in-flight detect()/getUserMedia callback bails out
    if (cs.rafId) cancelAnimationFrame(cs.rafId);
    if (cs.stream) { try { cs.stream.getTracks().forEach(function(t){ t.stop(); }); } catch(e){} }
    if (cs.modalEl && cs.modalEl.parentNode) cs.modalEl.parentNode.removeChild(cs.modalEl);
  }
  function handleCameraCode(code){
    if (!cameraScan) return;
    const opts = cameraScan.opts;
    const prevCount = opts.getCount ? opts.getCount() : 0;
    opts.feed(code);
    const modal = cameraScan.modalEl;
    if (!modal) return;
    const newCount = opts.getCount ? opts.getCount() : prevCount;
    const countEl = modal.querySelector("#camScanCount");
    if (countEl) countEl.textContent = "Scanned "+newCount+(opts.targetCount!=null ? (" of "+opts.targetCount) : "");
    if (newCount > prevCount) {
      const flash = modal.querySelector("#camScanFlash");
      if (flash) {
        flash.style.transition = "none"; flash.style.opacity = "0.55";
        requestAnimationFrame(function(){ flash.style.transition = "opacity .4s"; flash.style.opacity = "0"; });
      }
      showToast("Scanned: "+code);
    }
    if (opts.targetCount != null && newCount >= opts.targetCount) {
      setTimeout(function(){ closeCameraScan(); }, 500);
    }
  }
  // opts: { targetCount:Number|null, getCount:function()->Number, feed:function(code) }
  function openCameraScan(opts){
    closeCameraScan();
    opts = opts || {};
    const modal = document.createElement("div");
    modal.className = "modal-backdrop";
    modal.style.zIndex = "60";
    modal.innerHTML =
      '<div class="card modal" style="max-width:420px;text-align:center;">'+
        '<h3 style="margin-bottom:10px;">Scan Serial Numbers</h3>'+
        '<div id="camScanCount" style="font-weight:700;margin-bottom:10px;">Scanned 0'+(opts.targetCount!=null?(' of '+opts.targetCount):'')+'</div>'+
        '<div id="camScanVideoWrap" style="position:relative;border-radius:12px;overflow:hidden;background:#000;min-height:220px;display:flex;align-items:center;justify-content:center;">'+
          '<video id="camScanVideo" playsinline autoplay muted style="width:100%;max-height:320px;display:block;"></video>'+
          '<div id="camScanFlash" style="position:absolute;inset:0;background:var(--good);opacity:0;pointer-events:none;"></div>'+
        '</div>'+
        '<div id="camScanMsg" style="color:var(--muted);font-size:13px;margin-top:10px;"></div>'+
        '<button class="btn btn-primary" id="camScanDoneBtn" style="margin-top:16px;">Done — Close Camera</button>'+
      '</div>';
    document.body.appendChild(modal);
    cameraScan = { stream:null, rafId:null, lastCode:null, lastCodeAt:0, opts:opts, modalEl:modal };
    modal.querySelector("#camScanDoneBtn").onclick = function(){ closeCameraScan(); };
    modal.addEventListener("click", function(e){ if (e.target===modal) closeCameraScan(); });

    const msgEl = modal.querySelector("#camScanMsg");
    const videoWrap = modal.querySelector("#camScanVideoWrap");
    function unsupported(){
      videoWrap.style.display = "none";
      msgEl.textContent = "Camera scanning isn’t available on this device/browser — use manual entry below.";
    }
    if (!("BarcodeDetector" in window)) { unsupported(); return; }
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) { unsupported(); return; }

    navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" } }).then(function(stream){
      if (!cameraScan || cameraScan.modalEl !== modal) { try { stream.getTracks().forEach(function(t){ t.stop(); }); } catch(e){} return; }
      cameraScan.stream = stream;
      const video = modal.querySelector("#camScanVideo");
      video.srcObject = stream;
      video.play().catch(function(){});
      let detector;
      try {
        detector = new BarcodeDetector({ formats:["code_128","code_39","ean_13","qr_code","upc_a","upc_e"] });
      } catch(e){ unsupported(); return; }
      function loop(){
        if (!cameraScan || cameraScan.modalEl !== modal) return;
        detector.detect(video).then(function(codes){
          if (!cameraScan || cameraScan.modalEl !== modal) return;
          if (codes && codes.length) {
            const code = (codes[0].rawValue||"").trim();
            const now = Date.now();
            if (code && (code !== cameraScan.lastCode || now - cameraScan.lastCodeAt > 3000)) {
              cameraScan.lastCode = code; cameraScan.lastCodeAt = now;
              handleCameraCode(code);
            }
          }
          if (cameraScan && cameraScan.modalEl === modal) cameraScan.rafId = requestAnimationFrame(loop);
        }).catch(function(){
          if (cameraScan && cameraScan.modalEl === modal) cameraScan.rafId = requestAnimationFrame(loop);
        });
      }
      cameraScan.rafId = requestAnimationFrame(loop);
    }).catch(function(){
      unsupported();
    });
  }

  function findTaskByNameOrAlias(label){
    const key = (label||"").trim().toLowerCase();
    if (!key) return null;
    return STATE.tasks.find(function(t){
      if (t.name.trim().toLowerCase() === key) return true;
      return (t.aliases||[]).some(function(a){ return a.trim().toLowerCase() === key; });
    }) || null;
  }

  // Feature 4 (weekly pending-serials tracking): for every week that has ANY activity on
  // the serial task, computes target (sum of `made` across that week's serial-task
  // entries) and scanned (count of that week's serial rows for the serial task). Computed
  // fresh from raw data every time — nothing is carried forward week to week.
  function serialWeekTargets(){
    const map = {};
    function bucket(key, start){
      if (!map[key]) map[key] = { target:0, scanned:0, start:start };
      return map[key];
    }
    STATE.entries.forEach(function(e){
      if (e.taskId !== STATE.serialTaskId) return;
      const key = weekKeyOf(e.entryDate);
      bucket(key, weekStartFor(e.entryDate)).target += e.made;
    });
    STATE.serials.forEach(function(s){
      if (s.taskId !== STATE.serialTaskId) return;
      const basis = s.entryDate || s.ts;
      const key = weekKeyOf(basis);
      bucket(key, weekStartFor(basis)).scanned += 1;
    });
    return map;
  }
  // Past (non-current) weeks whose serial-task target hasn't been fully scanned yet —
  // feeds the manager-dashboard catch-up reminder. Each week is kept accounted separately
  // under its own week key; a shortfall never rolls forward into the current week.
  function serialCatchupWeeks(){
    const map = serialWeekTargets();
    const curKey = weekKeyOf(new Date());
    const out = [];
    Object.keys(map).forEach(function(key){
      if (key === curKey) return;
      const info = map[key];
      if (info.target > 0 && info.scanned < info.target) {
        out.push({ key:key, start:info.start, target:info.target, scanned:info.scanned, shortfall: info.target - info.scanned });
      }
    });
    out.sort(function(a,b){ return b.start - a.start; });
    return out;
  }
  function aggregateWeek(weekKey){
    const byTask = {};
    STATE.entries.forEach(function(e){
      if (weekKeyOf(e.entryDate) !== weekKey) return;
      const agg = byTask[e.taskId] || (byTask[e.taskId] = { made:0, faults:0, count:0, lastTs:null, lastEntry:null });
      agg.made += e.made;
      agg.faults += e.faults;
      agg.count += 1;
      if (!agg.lastTs || new Date(e.ts) > new Date(agg.lastTs)) { agg.lastTs = e.ts; agg.lastEntry = e; }
    });
    return byTask;
  }
  function aggregateMonth(monthKey){
    const byTask = {};
    STATE.entries.forEach(function(e){
      if (monthKeyOf(e.entryDate) !== monthKey) return;
      const agg = byTask[e.taskId] || (byTask[e.taskId] = { made:0, faults:0, count:0, lastTs:null, lastEntry:null });
      agg.made += e.made;
      agg.faults += e.faults;
      agg.count += 1;
      if (!agg.lastTs || new Date(e.ts) > new Date(agg.lastTs)) { agg.lastTs = e.ts; agg.lastEntry = e; }
    });
    return byTask;
  }
  function yieldPct(made, faults, ppu){
    ppu = ppu || 1;
    const total = made*ppu;
    return total > 0 ? ((total - faults)/total*100) : null;
  }
  function faultPct(made, faults, ppu){
    ppu = ppu || 1;
    const total = made*ppu;
    return total > 0 ? (faults/total*100) : null;
  }
  function tierFor(kind, pct){
    if (pct == null) return "idle";
    if (kind === "yield") return pct >= 97 ? "good" : (pct >= 90 ? "warn" : "bad");
    return pct <= 3 ? "good" : (pct <= 10 ? "warn" : "bad");
  }
  function comboTotals(taskIds, curAgg){
    let made=0, faults=0, capacity=0;
    (taskIds||[]).forEach(function(tid){
      const a = curAgg[tid];
      if (!a) return;
      const t = findTask(tid);
      const ppu = (t && t.partsPerUnit) || 1;
      made += a.made; faults += a.faults; capacity += a.made*ppu;
    });
    return { made:made, faults:faults, capacity:capacity, yield:yieldPct(capacity,faults,1), faultRate:faultPct(capacity,faults,1) };
  }
  function buildWorkerTaskRows(filterFn){
    const byWorker = {};
    STATE.entries.filter(filterFn).forEach(function(e){
      const task = findTask(e.taskId);
      const ppu = (task && task.partsPerUnit) || 1;
      const w = byWorker[e.workerId] || (byWorker[e.workerId] = { workerId:e.workerId, tasks:{}, made:0, faults:0, capacity:0 });
      const tk = w.tasks[e.taskId] || (w.tasks[e.taskId] = { made:0, faults:0, capacity:0, ppu:ppu });
      tk.made += e.made; tk.faults += e.faults;
    });
    // Negative correction entries (Fix 2) are summed in as-is above; clamp the AGGREGATE
    // running total at zero here (never the individual entry) so a correction can't drive
    // a displayed total, capacity, or yield below zero.
    Object.keys(byWorker).forEach(function(workerId){
      const w = byWorker[workerId];
      Object.keys(w.tasks).forEach(function(taskId){
        const tk = w.tasks[taskId];
        tk.made = Math.max(0, tk.made);
        tk.faults = Math.max(0, tk.faults);
        tk.capacity = tk.made * tk.ppu;
        delete tk.ppu;
        w.made += tk.made; w.faults += tk.faults; w.capacity += tk.capacity;
      });
    });
    return byWorker;
  }

  function addEntry(workerId, taskId, made, faults, by, opts){
    opts = opts || {};
    const task = findTask(taskId);
    const ppu = (task && task.partsPerUnit) || 1;
    const madeNum = toSignedInt(made);
    let faultsNum = toSignedInt(faults);
    // The made*ppu cap on faults only makes sense for a normal (non-negative) entry.
    // A negative correction entry (Fix 2 — worker self-service correction) is stored
    // exactly as typed, uncapped, so it becomes its own auditable row and nets out of
    // the running total cleanly. Any resulting negative running total is clamped to
    // zero where totals are aggregated for display (buildWorkerTaskRows), not here.
    if (madeNum >= 0 && faultsNum >= 0) {
      faultsNum = Math.min(faultsNum, madeNum*ppu);
    }
    const ts = opts.ts || new Date().toISOString();
    const entry = {
      id: uid("e"),
      workerId: workerId,
      taskId: taskId,
      made: madeNum,
      faults: faultsNum,
      ts: ts,
      // The day this entry is attributed to for weekly/monthly/YTD bucketing (Fix 3) —
      // distinct from ts, which stays the real submission moment for audit/ordering.
      entryDate: opts.entryDate || dateOnlyStr(ts),
      by: by,
      // Fix 4: when set (manager id, e.g. "mark"/"daniel"), this entry was submitted via
      // the "Enter for a Worker" flow on that manager's behalf — distinct from a normal
      // worker self-entry — so it can be attributed as "Entered by <mgr> for <worker>".
      enteredByManager: opts.enteredByManager || null
    };
    STATE.entries.push(entry);
    persist(false, opts.successMsg, opts.failMsg);
    return entry;
  }

  /* ---------------- rendering: shell ---------------- */
  function renderConnectingScreen(){

        '<div class="kiosk-sub">Waiting to sync with the shared record before showing any numbers.</div>'+
      '</div></div>'

  // Glitch fix: every render() fully replaces #app's innerHTML, which would otherwise
  // reset the scroll position of any in-page scrollable list on every single render —
  // including ones triggered just by clicking a button elsewhere on the same screen, not
  // only background remote updates. Any element marked data-scroll-keep (and given a
  // stable id) has its scrollTop captured here and restored after the rebuild.
  function captureScrollState(){
    const map = {};
    document.querySelectorAll("[data-scroll-keep]").forEach(function(el){
      if (el.id) map[el.id] = el.scrollTop;
    });
    return map;
  }
  function restoreScrollState(map){
    Object.keys(map||{}).forEach(function(id){
      const el = document.getElementById(id);
      if (el) el.scrollTop = map[id];
    });
  }
  // Only used for a "quiet" (suppressFocusSteal) render — captures the exact input/
  // textarea the user is actively typing into so it can be restored after the DOM rebuild,
  // without the usual focusPrimaryInput() auto-select behavior stealing the selection.
  function captureActiveInputState(){
    const el = document.activeElement;
    if (!el || !el.id) return null;
    if (el.tagName !== "INPUT" && el.tagName !== "TEXTAREA") return null;
    // Reading selectionStart/End throws on input types that don't support text selection
    // (number, date, email, etc. — only text/search/url/tel/password/textarea do), so this
    // is wrapped defensively; losing just the caret position is harmless, but an uncaught
    // throw here would happen mid-subscribe-callback and break live sync entirely.
    let selStart = null, selEnd = null;
    try { selStart = (typeof el.selectionStart === "number") ? el.selectionStart : null; } catch(e){}
    try { selEnd = (typeof el.selectionEnd === "number") ? el.selectionEnd : null; } catch(e){}
    return { id: el.id, value: el.value, selStart: selStart, selEnd: selEnd };
  }
  function restoreActiveInputState(state){
    if (!state) return;
    const el = document.getElementById(state.id);
    if (!el || (el.tagName !== "INPUT" && el.tagName !== "TEXTAREA")) return;
    try {
      el.value = state.value;
      el.focus();
      if (state.selStart != null && typeof el.setSelectionRange === "function") {
        el.setSelectionRange(state.selStart, state.selEnd != null ? state.selEnd : state.selStart);
      }
    } catch(e){}
  }
  // Glitch fix: a native <select> can't survive its containing DOM being torn down and
  // rebuilt while its dropdown is open/focused — the browser just closes it. A quiet
  // (background, remote-triggered) render that lands while the user has a <select>
  // focused defers the actual DOM rebuild until they finish with it (blur or change),
  // rather than yanking the open list out from under them. STATE itself is already up to
  // date by the time this is called — only the visual catch-up is delayed.
  let pendingRenderRetry = false;
  function render(){
    const app = document.getElementById("app");
    if (!stateConfirmed) {
      document.getElementById("app").innerHTML = renderConnectingScreen();
      return;
    }
    const quiet = suppressFocusSteal;
    if (quiet) {
      // A retry is already queued from an earlier deferred render — it'll pick up
      // whatever the latest STATE is once it actually fires, so there's nothing to do
      // here except not rebuild the DOM out from under the still-open select again.
      if (pendingRenderRetry) return;
      const active = document.activeElement;
      if (active && active.tagName === "SELECT") {
        pendingRenderRetry = true;
        const retry = function(){
          active.removeEventListener("change", retry);
          active.removeEventListener("blur", retry);
          pendingRenderRetry = false;
          render();
        };
        active.addEventListener("change", retry, { once:true });
        active.addEventListener("blur", retry, { once:true });
        return;
      }
    }
    const mode = getDeviceMode();
    let html = "";
    if (!mode) {
      html = renderModeChooser();
    } else if (mode === "manager") {
      html = renderTopbar("manager") + renderMessageArea() + renderManager();
    } else {
      html = renderTopbar("worker") + renderMessageArea() + renderWorker();
    }
    if (toastMsg) html += '<div class="toast">'+escapeHtml(toastMsg)+'</div>';
    html += standupOverlayHtml();
    const scrollState = captureScrollState();
    const activeState = quiet ? captureActiveInputState() : null;
    app.innerHTML = html;
    restoreScrollState(scrollState);
    if (activeState) restoreActiveInputState(activeState);
    else focusPrimaryInput();
  }
  function focusPrimaryInput(){
    requestAnimationFrame(function(){
      const el = document.querySelector('[data-autofocus="1"]');
      if (!el) return;
      try {
        el.focus();
        if (el.value) el.select();
      } catch(e){}
    });
  }

  function statusPillHtml(){
    let dot = "good", label = "Synced";

    else if (saveStatus === "readonly") { dot="bad"; label="Read-only view"; }
    else if (saveStatus === "idle") { dot="good"; label="Ready"; }
    return '<span class="status-pill"><span class="status-dot '+dot+'"></span>'+label+'</span>';
  }

  /* ---------------- worker flow ---------------- */
  function renderWorker(){

  // Worker shortcuts: up to 3 tasks the worker has pinned themselves (via the pin button

  function taskShortcutsSection(owner){
