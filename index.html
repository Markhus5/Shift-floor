    const pinned = pinnedIds.map(function(id){ return findTask(id); }).filter(Boolean);

  function myEntriesSection(owner){

    const dayDate = (ui.myEntriesDate && /^\d{4}-\d{2}-\d{2}$/.test(ui.myEntriesDate)) ? ui.myEntriesDate : todayDateOnly();
    const weekStartStr = (ui.myEntriesWeekStart && /^\d{4}-\d{2}-\d{2}$/.test(ui.myEntriesWeekStart)) ? ui.myEntriesWeekStart : dateOnlyStr(weekStartFor(new Date()));
    const minStr = dateOnlyStr((function(){ const d = new Date(); d.setDate(d.getDate()-60); return d; })());

  function pickTaskBody(){

  function taskCardHtml(t, curAgg, opts){
    opts = opts || {};
    const a = curAgg[t.id];
    const made = a?a.made:0, faults = a?a.faults:0;
    const ppu = t.partsPerUnit || 1;
    const y = yieldPct(made,faults,ppu), f = faultPct(made,faults,ppu);
    const yTier = tierFor("yield", y), fTier = tierFor("fault", f);
    let recent = '<div class="task-recent">No updates yet this week.</div>';
    if (a && a.lastEntry) {
      const w = findWorker(a.lastEntry.workerId);
      let whoText;
      if (a.lastEntry.by === "manager") {
        const mgr = a.lastEntry.enteredByManager ? (STATE.managers||[]).find(function(m){ return m.id===a.lastEntry.enteredByManager; }) : null;
        whoText = mgr ? escapeHtml("Entered by "+mgr.name+" for "+(w?w.name:"worker")) : "entered by manager";
      } else {
        whoText = escapeHtml(w?w.name:"unknown");
      }
      recent = '<div class="task-recent">+<b>'+a.lastEntry.made+'</b> made / <b>'+a.lastEntry.faults+'</b> faults — '+fmtRelTime(a.lastEntry.ts)+' · '+whoText+'</div>';
    }
    const pinBtn = opts.pinned
      ? '<button class="chip-btn" onclick="App.unpinTask('+opts.slot+')">Unpin</button>'
      : '<button class="chip-btn" onclick="App.pinTask(\''+t.id+'\')">📌 Pin</button>';
    const fColor = f==null ? "inherit" : (fTier==="good"?"var(--good)":fTier==="warn"?"var(--warn)":"var(--bad)");
    return (
      '<div class="card task-card" draggable="true" ondragstart="event.dataTransfer.setData(\'text/plain\',\''+t.id+'\')">'+
        '<div class="task-card-head"><h3>'+escapeHtml(t.name)+'</h3>'+
          (a ? '<span class="badge '+yTier+'">'+fmtPct(y)+' yield</span>' : '<span class="badge idle">idle</span>')+
        '</div>'+

  // Groups an (already time-sorted) serials list by the day it's attributed to

  // used both by the manager serials panel (date headings) and the CSV/clipboard copy.
  function groupSerialsByDate(list){
    const order = [];
    const map = {};
    list.forEach(function(s){
      const key = s.entryDate || dateOnlyStr(s.ts);
      if (!map[key]) { map[key] = []; order.push(key); }
      map[key].push(s);

    return order.map(function(key){ return { date:key, items:map[key] }; });

    // (sum of `made` for the serial task this week). Falls back to the plain count when
    // there's no target yet (Y===0) or when viewing All-Time, matching prior behavior.
    const weekInfo = serialWeekTargets()[curKey];

    // copy too. Each row underneath keeps its own original per-row format ("Kim 1 hour ago").
    const serialRowHtml = function(s){

  // Feature 4: reminder banner on the manager dashboard listing any PAST week whose
  // serial-task target wasn't fully scanned. Each shows a "Catch up" button that presets
  // the manual-add date to that week's start (App.startCatchupScan) so newly-added serials
  // get attributed to that week, not today.
  function serialCatchupBanner(){
    if (!STATE.serialTaskId) return "";
    // Dismissible: if a past shortfall is never going to be fulfilled (the units are long
    // gone, nobody's scanning them now), "Dismiss" acknowledges it the same way other
    // notices are acked, so it stops taking up space here permanently rather than nagging
    // every day it's open.
    const acked = ackGet("td_ackSerialCatchup");
    const weeks = serialCatchupWeeks().filter(function(w){ return acked.indexOf(w.key)===-1; });
    if (!weeks.length) return "";
    const rows = weeks.map(function(w){
      return '<div class="list-row"><div>'+
          '<b>'+w.shortfall+'</b> unit'+(w.shortfall===1?"":"s")+' from the week of '+escapeHtml(fmtDateShort(w.start))+' still need'+(w.shortfall===1?"s":"")+' serials scanned '+
          '<span style="color:var(--muted);font-size:12.5px;">('+w.scanned+' of '+w.target+' done)</span>'+
        '</div>'+
        '<div class="actions">'+
          '<button class="chip-btn" onclick="App.startCatchupScan(\''+dateOnlyStr(w.start)+'\')">Catch up</button>'+
          '<button class="chip-btn" onclick="App.ackItem(\'serialCatchup\',\''+w.key+'\')" title="Hide this — use once it can no longer be fulfilled">Dismiss</button>'+
        '</div>'+
      '</div>';
    }).join("");
    return '<div class="card banner" style="background:var(--warn-soft);flex-direction:column;align-items:stretch;gap:4px;">'+
      '<div style="font-weight:700;">⚠ Pending serial scans from past weeks</div>'+
      rows+
    '</div>';
  }
  // Feature 5: week/month options for the summary CSV downloads — like the Last Week
  // Summary picker above, but includes the CURRENT week/month too (downloads default to
  // it) alongside every past period that has entry data.
  function downloadWeekOptions(){
    const keys = {};
    keys[weekKeyOf(new Date())] = true;
    STATE.entries.forEach(function(e){ keys[weekKeyOf(e.entryDate)] = true; });
    return Object.keys(keys).sort(function(a,b){ return new Date(b) - new Date(a); });
  }
  function downloadMonthOptions(){
    const keys = {};
    keys[monthKeyOf(new Date())] = true;
    STATE.entries.forEach(function(e){ keys[monthKeyOf(e.entryDate)] = true; });
    return Object.keys(keys).sort(function(a,b){ return a<b?1:(a>b?-1:0); });
  }
  // Fix 5 (Last Week Summary week-picker): available past weeks are derived from
  // whichever weeks actually have entries (via entryDate), plus the most recently
  // completed week so it's always selectable as the default even with no data yet.
  function lastWeekSummaryWeekOptions(){
    const now = new Date();
    const curKey = weekKeyOf(now);
    const curStart = weekStartFor(now);
    const defaultPrevStart = new Date(curStart); defaultPrevStart.setDate(defaultPrevStart.getDate()-7);
    const defaultPrevKey = weekKeyOf(defaultPrevStart);
    const keys = {};
    STATE.entries.forEach(function(e){
      const wk = weekKeyOf(e.entryDate);
      if (wk !== curKey) keys[wk] = true;
    });
    keys[defaultPrevKey] = true;
    const sorted = Object.keys(keys).sort(function(a,b){ return new Date(b) - new Date(a); });
    return { keys: keys, sorted: sorted, defaultKey: defaultPrevKey };
  }

  function managerDashboardBody(){
    const now = new Date();
    const curStart = weekStartFor(now);
    const curKey = weekKeyOf(now);

    const curAgg = aggregateWeek(curKey);
    const pendingCount = STATE.pendingRequests.filter(function(r){ return r.status==="pending"; }).length;

    const headlineTask = findTask(STATE.headlineTaskId);
    const hAgg = headlineTask ? curAgg[headlineTask.id] : null;
    const hMade = hAgg?hAgg.made:0, hFaults = hAgg?hAgg.faults:0;
    const hPpu = (headlineTask && headlineTask.partsPerUnit) || 1;
    const hYield = yieldPct(hMade,hFaults,hPpu), hFault = faultPct(hMade,hFaults,hPpu);

    let reassignBanner = "";
    if (isReassignOpen()) {
      const mins = Math.max(1, Math.ceil((new Date(STATE.reassignUntil).getTime()-Date.now())/60000));
      reassignBanner = '<div class="card banner" style="background:var(--warn-soft);"><span>🔓 Reassignment window open — any worker tablet can switch worker. Closes in ~'+mins+' min.</span><button class="chip-btn" onclick="App.closeReassignWindow()">Close Now</button></div>';
    }

    const tasks = activeTasks().slice().sort(function(a,b){
      const la = curAgg[a.id] ? new Date(curAgg[a.id].lastTs).getTime() : -1;
      const lb = curAgg[b.id] ? new Date(curAgg[b.id].lastTs).getTime() : -1;
      if (la !== lb) return lb - la;
      return a.name.localeCompare(b.name);
    });
    const cards = tasks.map(function(t){ return taskCardHtml(t, curAgg, {}); }).join("");

    // Feature 5: week/month pickers for the CSV downloads. Default to the current week /
    // current month (matching prior always-current behavior) but let the manager pick any

  // Feature: Fault Log traceability — manager-facing panel listing every STATE.faultBoards
  // record, filterable by status, with the manager-only Mark Received / Set Aside actions.
  function managerFaultLogPanel(){
    const filter = ui.faultLogFilter || "all";
    const boards = (STATE.faultBoards||[]).slice().sort(function(a,b){ return new Date(b.createdAt||0) - new Date(a.createdAt||0); });
    const filtered = filter==="all" ? boards : boards.filter(function(b){ return b.status===filter; });
    const tabDefs = [["all","All"],["for_repair","For Repair"],["received","Received"],["passed","Passed"],["set_aside","Set Aside"]];
    const tabs = tabDefs.map(function(f){
      return '<button class="chip-btn'+(filter===f[0]?' chip-active':'')+'" onclick="App.setFaultLogFilter(\''+f[0]+'\')">'+f[1]+'</button>';
    }).join(" ");
    const rows = filtered.map(function(b){
      const task = findTask(b.taskId);
      const last = b.history[b.history.length-1] || {};
      const expanded = !!(ui.faultLogExpanded && ui.faultLogExpanded[b.id]);
      const badgeClass = faultStatusBadgeClass(b.status);
      let actions = '<button class="chip-btn" onclick="App.toggleFaultLogExpand(\''+b.id+'\')">'+(expanded?"Hide":"View")+' History</button>';
      if (b.status === "for_repair") {
        actions += '<button class="chip-btn" style="background:var(--accent);color:var(--accent-ink);border:none;" onclick="App.markFaultBoardReceived(\''+b.id+'\')">Mark Received</button>';
      }
      if (b.status !== "set_aside") {
        actions += '<button class="chip-btn danger" onclick="App.setAsideFaultBoard(\''+b.id+'\')">Set Aside</button>';
      } else {
        actions += '<button class="chip-btn" onclick="App.undoSetAsideFaultBoard(\''+b.id+'\')">Undo Set Aside</button>';
      }
      return (
        '<div class="card" style="padding:14px 16px;margin-bottom:10px;">'+
          '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline;">'+
            '<div><b class="num">'+escapeHtml(b.serial)+'</b> · '+escapeHtml(task?task.name:"(unknown task)")+'</div>'+
            '<span class="badge '+badgeClass+'">'+escapeHtml(FAULT_STATUS_LABELS[b.status]||b.status)+'</span>'+
          '</div>'+
          '<div style="font-size:13px;color:var(--muted);margin-top:6px;">'+escapeHtml(last.desc||"—")+(last.job?(' · Job '+escapeHtml(last.job)):"")+(last.entryDate?(' · '+escapeHtml(last.entryDate)):"")+'</div>'+
          (expanded ? faultBoardHistoryHtml(b) : "")+

        '</div>'
      );
    }).join("");
    return (
      '<div class="card panel">'+
        '<div class="panel-head"><h3>Fault Log</h3><button class="link-btn" style="margin:0;" onclick="App.gotoManager(\'dashboard\')">← Back to dashboard</button></div>'+

      '</div>'
    );

          '<div class="actions" style="margin-top:10px;"><button class="chip-btn danger" onclick="App.submitRestorePasscode(\''+b.id+'\')">Confirm</button>'+

          '<button class="chip-btn" onclick="App.cancelRestoreBackup()">Cancel</button></div></div>';

  // Recover missing entries — pulls just the entries from a chosen day (or range) out of a
  // backup snapshot and adds back only whatever isn't already in the live data, leaving
  // everything else (including anything entered since) completely untouched. Built for the
  // case where "Restore this snapshot" would be too blunt — e.g. new data has been added
  // since the loss and can't be risked by a full overwrite.
  function recoverMissingEntriesSection(){
    const list = backupsListCache || [];
    const yesterday = dateOnlyStr((function(){ const d = new Date(); d.setDate(d.getDate()-1); return d; })());
    const from = ui.recoverFrom || yesterday;
    const to = ui.recoverTo || yesterday;
    const backupOpts = list.map(function(b){
      const d = new Date(b.createdAt);
      const label = fmtDateShort(d)+" "+d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear()+" · "+pad2(d.getHours())+":"+pad2(d.getMinutes())+" ("+b.entryCount+" entries)";
      return '<option value="'+b.id+'"'+(b.id===ui.recoverBackupId?' selected':'')+'>'+escapeHtml(label)+'</option>';
    }).join("");
    let previewHtml = "";
    if (ui.recoverLoading) {
      previewHtml = '<div style="color:var(--muted);font-size:14px;margin-top:10px;">Comparing against the current live data…</div>';
    } else if (ui.recoverError) {
      previewHtml = '<div style="color:var(--bad);font-size:14px;margin-top:10px;">'+escapeHtml(ui.recoverError)+'</div>';
    } else if (ui.recoverPreview) {
      const pv = ui.recoverPreview;
      if (!pv.missingEntries.length) {
        previewHtml = '<div style="color:var(--muted);font-size:14px;margin-top:10px;">No missing entries found in that date range — the live data already has everything this snapshot had for '+escapeHtml(pv.from===pv.to?pv.from:(pv.from+' to '+pv.to))+'.</div>';
      } else {
        const byWorkerCounts = {};
        pv.missingEntries.forEach(function(e){
          const w = findWorker(e.workerId);
          const name = w ? w.name : "Unknown worker";
          byWorkerCounts[name] = (byWorkerCounts[name]||0) + 1;
        });
        const breakdown = Object.keys(byWorkerCounts).map(function(name){ return escapeHtml(name)+" ("+byWorkerCounts[name]+")"; }).join(", ");
        previewHtml =
          '<div class="confirm-summary" style="margin-top:10px;">'+
            '<div><span>Found</span><b>'+pv.missingEntries.length+' missing entr'+(pv.missingEntries.length===1?'y':'ies')+'</b></div>'+
            '<div><span>By worker</span><b>'+breakdown+'</b></div>'+
            '<div><span>Date range</span><b>'+escapeHtml(pv.from===pv.to?pv.from:(pv.from+' to '+pv.to))+'</b></div>'+
          '</div>'+
          '<div style="color:var(--muted);font-size:13px;margin-top:8px;">Adding these back only inserts what\'s missing — anything already in the live data (including anything entered today) is left exactly as it is.</div>'+
          '<div class="btn-row" style="margin-top:10px;"><button class="btn btn-primary" onclick="App.confirmRecoverMissingEntries()">Add These '+pv.missingEntries.length+' Back</button></div>';
      }
    }
    return (
      '<div style="margin-top:22px;border-top:1px dashed var(--line);padding-top:16px;">'+
        '<div class="section-title" style="margin-top:0;">Recover missing entries from a backup</div>'+
        '<div style="color:var(--muted);font-size:13px;margin-bottom:12px;">Pick a snapshot and a date range — this only adds back entries from that range that aren\'t already in the live data. It never overwrites or removes anything.</div>'+
        '<div class="field"><label>Snapshot</label><select id="recoverBackupSelect" onchange="App.setRecoverBackupId(this.value)">'+(backupOpts||'<option value="">No backups available</option>')+'</select></div>'+
        '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px;">'+
          '<div class="field" style="flex:1;min-width:160px;"><label>From date</label><input type="date" id="recoverFromDate" value="'+from+'" max="'+todayDateOnly()+'" onchange="App.setRecoverFrom(this.value)"></div>'+
          '<div class="field" style="flex:1;min-width:160px;"><label>To date</label><input type="date" id="recoverToDate" value="'+to+'" max="'+todayDateOnly()+'" onchange="App.setRecoverTo(this.value)"></div>'+
        '</div>'+
        '<button class="chip-btn" style="background:var(--accent);color:var(--accent-ink);border:none;" onclick="App.previewRecoverMissingEntries()">Preview What Would Be Added</button>'+
        previewHtml+
      '</div>'
    );
  }

  // Shared by App.submitEnterFor()/finishEnterForNow() — actually writes the entry (and
  // any scanned serials) and closes the modal, resetting every ef*/entryDate ui field.
  function finishEnterFor(workerId, taskId, made, faults, entryDate, serialsList){
    const mgrId = getMgrIdentity();
    const entry = addEntry(workerId, taskId, made, faults, "manager", { entryDate: entryDate, enteredByManager: mgrId, successMsg:"Entry saved." });
    if (serialsList && serialsList.length) {
      const ts = new Date().toISOString();
      const dateForSerials = entryDate || todayDateOnly();
      serialsList.forEach(function(s){
        STATE.serials.push({ id:uid("s"), serial:s, taskId:taskId, workerId:workerId, entryId:entry.id, ts:ts, entryDate:dateForSerials });
      });
    }
    setUi({ modal:null, entryDate:null, entryDateEditing:false, efStage:null, efSerialsList:null, efWorkerId:null, efTaskId:null, efMade:null, efFaults:null, efEntryDate:null, efSerialError:null });
    showToast("Entry saved for "+((findWorker(workerId)||{}).name||"worker")+".");
  }

  /* ---------------- actions ---------------- */
  const App = {
    switchMode: function(m){ setDeviceMode(m); ui = { screen:null }; saveUi(); render(); },
    goto: function(screen){
      if (screen === "pickTask") setUi({ screen:screen, taskPickerSelectedId:null });
      else setUi({ screen:screen });
    },
    toggleRecall: function(){ setUi({ recallNotices: !ui.recallNotices }); },
    ackItem: function(kind,id){
      const map = { notice:"td_ackNotices", msg:"td_ackWorkerMsgs", assign:"td_ackAssignments", mgrnotice:"td_ackMgrNotices", serialCatchup:"td_ackSerialCatchup" };
      ackAdd(map[kind], id);

    },
    confirmOwnerPick: function(){
      const sel = document.getElementById("ownerSelect");
      if (!sel || !sel.value) return;
      setAssignedWorkerId(sel.value);
      setUi({ screen:"pickTask", taskPickerSelectedId:null });
    },
    changeOwner: function(){ setAssignedWorkerId(null); setUi({ screen:"pickOwner" }); },
    selectPickTask: function(taskId){ setUi({ taskPickerSelectedId: taskId }); },
    // Pinned-shortcut tap: skips the task picker entirely and goes straight to "made".
    pickTaskShortcut: function(taskId){
      if (!findTask(taskId)) return;
      setUi({ screen:"enterMade", taskId:taskId, taskPickerSelectedId:null });
    },
    toggleWorkerTaskPin: function(taskId){
      const w = findWorker(getAssignedWorkerId());
      if (!w) return;
      if (!Array.isArray(w.pinnedTasks)) w.pinnedTasks = [];
      const idx = w.pinnedTasks.indexOf(taskId);
      if (idx > -1) {
        w.pinnedTasks.splice(idx, 1);
      } else {
        // Newest pin goes to the top; bump the bottom (oldest) one once past the 3-item cap.
        w.pinnedTasks.unshift(taskId);
        if (w.pinnedTasks.length > 3) w.pinnedTasks.pop();
      }
      persist(false, null, "Saved locally — will sync.");
      render();
    },
    moveWorkerShortcut: function(idx, dir){
      const w = findWorker(getAssignedWorkerId());
      if (!w || !Array.isArray(w.pinnedTasks)) return;
      const newIdx = idx + dir;
      if (newIdx < 0 || newIdx >= w.pinnedTasks.length) return;
      const arr = w.pinnedTasks.slice();
      const tmp = arr[idx]; arr[idx] = arr[newIdx]; arr[newIdx] = tmp;
      w.pinnedTasks = arr;
      persist(false, null, "Saved locally — will sync.");
      render();
    },
    toggleShortcutsCollapse: function(){ setShortcutsCollapsed(!isShortcutsCollapsed()); render(); },
    toggleMyEntriesCollapse: function(){ setMyEntriesCollapsed(!isMyEntriesCollapsed()); render(); },
    setMyEntriesView: function(v){ setUi({ myEntriesView: v==="week"?"week":"day" }); },
    setMyEntriesDate: function(val){ if (!val || !/^\d{4}-\d{2}-\d{2}$/.test(val)) return; setUi({ myEntriesDate: val }); },
    setMyEntriesWeekStart: function(val){ if (!val || !/^\d{4}-\d{2}-\d{2}$/.test(val)) return; setUi({ myEntriesWeekStart: val }); },
    pickTask: function(){
      const val = ui.taskPickerSelectedId;
      if (!val) return;
      if (val === "__other__") setUi({ screen:"otherJobLabel" });
      else setUi({ screen:"enterMade", taskId:val });
    },
    submitOtherLabel: function(){
      const input = document.getElementById("otherJobInput");
      const label = input ? input.value.trim() : "";
      if (!label) return;
      setUi({ screen:"enterMade", taskId:"__other__", otherLabel:label });
    },
    submitMade: function(){
      const input = document.getElementById("madeInput");
      const val = toSignedInt(input ? input.value : 0);
      setUi({ screen:"enterFaults", made:val });
    },
    // Feature 3: interstitial between "faults entered" and "scan serials" for the serial
    // task — lets the worker scan now or defer without blocking their flow. Skipped
    // automatically when there are zero good units to scan (nothing to prompt about).
    goScanPrompt: function(){
      const input = document.getElementById("faultsInput");
      const faults = clamp0(Math.min(clamp0(input ? input.value : 0), ui.made));
      const needed = Math.max(0, ui.made - faults);
      if (needed <= 0) { setUi({ faults:faults }); App.submitFaults(); return; }
      setUi({ screen:"scanPrompt", faults:faults });
    },
    goScanSerials: function(){
      // Reached either directly (legacy callers) or via "Scan now" on scanPromptBody —
      // ui.faults is already set by goScanPrompt in the latter case, and #faultsInput may
      // no longer be on screen, so prefer the already-known value when present.
      const input = document.getElementById("faultsInput");
      const faults = (ui.screen === "scanPrompt") ? ui.faults : clamp0(Math.min(clamp0(input ? input.value : 0), ui.made));
      setUi({ screen:"scanSerials", faults:faults, serialsList: [], serialError:null });
    },
    // Feature 3: "Do this later" on scanPromptBody — logs the made/faults entry exactly
    // like a normal (non-scanning) submit, leaving this batch's serials unscanned/pending
    // (they show up in Feature 4's weekly target vs scanned count until caught up).
    deferScanning: function(){
      App.submitFaults();
    },
    addScannedSerial: function(){
      const input = document.getElementById("serialInput");
      const raw = input ? input.value.trim() : "";
      if (!raw) return;
      const needed = Math.max(0, ui.made - ui.faults);
      const list = (ui.serialsList || []).slice();
      if (list.length >= needed) { showToast("Already have "+needed+" serial(s) for this batch."); return; }

      const fmtErr = validateSerialFormat(raw);
      if (fmtErr) { setUi({ serialError:{ value:raw, message:fmtErr } }); focusSelectSerialInput(false); return; }

      const dup = STATE.serials.some(function(s){ return s.serial===raw; }) || list.indexOf(raw)>-1;
      if (dup) { setUi({ serialError:{ value:raw, message:"Already recorded — enter a different serial." } }); focusSelectSerialInput(false); return; }

      // Fault Log cross-check: a unit logged faulty (e.g. at Provisioning) shouldn't
      // silently count as a good/passed unit just because it's being scanned here. Any
      // fault-board record for this serial that isn't already "passed" interrupts the
      // scan with a confirm-as-good prompt (faultConfirmPromptBody) instead of being added
      // straight to the batch; "set_aside" units are blocked outright, since undoing a
      // set-aside is a manager decision.
      const existingFault = (STATE.faultBoards||[]).find(function(b){ return b.serial===raw && b.status!=="passed"; });
      if (existingFault) {
        if (existingFault.status === "set_aside") {
          setUi({ serialError:{ value:raw, message:"This unit was set aside — check with a manager before using it." } });
          focusSelectSerialInput(false);
          return;
        }
        closeCameraScan();

    submitFaults: function(){
      const workerId = getAssignedWorkerId();
      const made = ui.made;
      let faults;
      if (ui.screen === "scanSerials" || ui.screen === "scanPrompt" || ui.screen === "logFaultBoard") {
        faults = ui.faults;
      } else {
        const input = document.getElementById("faultsInput");
        faults = toSignedInt(input ? input.value : 0);
      }
      const entryDate = ui.entryDate || todayDateOnly();

      // Feature: Fault Log traceability — for FAULT_BOARD_TASK_NAMES tasks (Test-yield +
      // Provisioning) with faults>0, collect a serial/description/job/date for each faulty
      // unit BEFORE finishing this entry. Skipped once faultBoardStage is "done" (i.e.
      // we're re-entering here right after logFaultBoardNext() finished collecting the batch).
      if (faults > 0 && ui.faultBoardStage !== "done") {
        let resolvedTaskId = ui.taskId;
        if (ui.taskId === "__other__") {
          const otherLabel = (ui.otherLabel||"").trim();
          const match = findTaskByNameOrAlias(otherLabel);
          resolvedTaskId = match ? match.id : null;
        }
        if (resolvedTaskId && resolveNamesToIds(FAULT_BOARD_TASK_NAMES).indexOf(resolvedTaskId) > -1) {
          setUi({
            screen:"logFaultBoard", faults:faults, faultBoardStage:"collecting", faultBoardCount:faults,
            faultBoardIndex:0, faultBoardQueue:[], faultBoardTaskId:resolvedTaskId,
            fbDate:null, fbDateEditing:false
          });
          return;
        }
      }

      if (ui.taskId === "__other__") {
        const label = (ui.otherLabel||"").trim();
        const match = findTaskByNameOrAlias(label);
        if (match) {
          addEntry(workerId, match.id, made, faults, "worker", { entryDate:entryDate, successMsg:"Entry logged to the dashboard ✅", failMsg:"Not sent yet — retrying…" });
          setUi({ screen:"askAnother", faults:faults, resolvedName:match.name, pendingReview:false, serialsCount:null, faultBoardStage:null, faultBoardCount:0, faultBoardIndex:0, faultBoardQueue:null, faultBoardTaskId:null, faultConfirm:null });
        } else {
          STATE.pendingRequests.push({ id:uid("p"), workerId:workerId, label:label, made:made, faults:faults, ts:new Date().toISOString(), entryDate:entryDate, status:"pending" });
          persist(false, "Sent to the manager for review ✅", "Not sent yet — retrying…");
          setUi({ screen:"askAnother", faults:faults, pendingReview:true, resolvedName:null, serialsCount:null, faultBoardStage:null, faultBoardCount:0, faultBoardIndex:0, faultBoardQueue:null, faultBoardTaskId:null, faultConfirm:null });
        }
      } else {
        // Feature 3: only require/attach the scanned serials when we're actually coming
        // out of the scan flow (screen==="scanSerials") — a "Do this later" defer from
        // scanPromptBody submits the entry normally with no serials attached, leaving this
        // batch's units pending (tracked by Feature 4's weekly target vs scanned count).
        const serialsToSave = (ui.taskId === STATE.serialTaskId && ui.screen === "scanSerials") ? (ui.serialsList||[]) : null;
        if (serialsToSave) {
          const needed = Math.max(0, made - faults);
          if (serialsToSave.length !== needed) { showToast("Enter all "+needed+" serial number(s) first."); return; }
        }
        const entry = addEntry(workerId, ui.taskId, made, faults, "worker", { entryDate:entryDate, successMsg:"Entry logged to the dashboard ✅", failMsg:"Not sent yet — retrying…" });
        if (serialsToSave && serialsToSave.length) {
          const ts = new Date().toISOString();
          serialsToSave.forEach(function(s){
            // Feature 4: attribute each serial to the same entryDate as the entry it came
            // from (not necessarily today, if this was a late/backdated entry).
            STATE.serials.push({ id:uid("s"), serial:s, taskId:ui.taskId, workerId:workerId, entryId:entry.id, ts:ts, entryDate:entryDate });
          });
        }
        setUi({ screen:"askAnother", faults:faults, resolvedName:null, pendingReview:false, serialsList:null, serialsCount: serialsToSave ? serialsToSave.length : null, faultBoardStage:null, faultBoardCount:0, faultBoardIndex:0, faultBoardQueue:null, faultBoardTaskId:null, faultConfirm:null });
      }
    },
    // Feature: Fault Log traceability — collects one faulty board's serial/description/
    // job/date, then either advances to the next board in this batch or (on the last one)
    // creates the STATE.faultBoards records and re-invokes submitFaults() to finish the
    // normal made/faults entry (faultBoardStage is "done" by then, so it won't loop back).
    logFaultBoardNext: function(){
      const serialEl = document.getElementById("fbSerialInput");
      const descEl = document.getElementById("fbDescInput");
      const jobEl = document.getElementById("fbJobInput");
      const serial = serialEl ? serialEl.value.trim() : "";
      const desc = descEl ? descEl.value.trim() : "";
      const job = jobEl ? jobEl.value.trim() : "";
      if (!serial) { showToast("Enter or scan the serial number."); return; }
      if (!desc) { showToast("Enter a fault description."); return; }
      const date = ui.fbDate || ui.entryDate || todayDateOnly();
      const queue = (ui.faultBoardQueue||[]).slice();
      queue.push({ serial:serial, desc:desc, job:job, entryDate:date });
      const nextIndex = (ui.faultBoardIndex||0) + 1;
      const count = ui.faultBoardCount || 0;
      if (nextIndex < count) {
        setUi({ faultBoardQueue:queue, faultBoardIndex:nextIndex, fbDate:null, fbDateEditing:false });
        return;
      }
      const workerId = getAssignedWorkerId();
      const worker = findWorker(workerId);
      const byName = worker ? worker.name : "Worker";
      const taskId = ui.faultBoardTaskId;
      queue.forEach(function(b){
        const ts = new Date().toISOString();
        STATE.faultBoards.push({
          id: uid("fb"),
          serial: b.serial,
          taskId: taskId,
          status: "for_repair",
          history: [{ id:uid("fbh"), action:"logged", status:"for_repair", desc:b.desc, job:b.job, entryDate:b.entryDate, ts:ts, by:byName }],
          createdAt: ts
        });
      });
      setUi({ faultBoardStage:"done", faultBoardQueue:null, fbDate:null, fbDateEditing:false });
      App.submitFaults();
    },

    previewRecoverMissingEntries: function(){
      const id = ui.recoverBackupId || (document.getElementById("recoverBackupSelect")||{}).value;
      const from = ui.recoverFrom || (document.getElementById("recoverFromDate")||{}).value;
      const to = ui.recoverTo || (document.getElementById("recoverToDate")||{}).value;
      if (!id) { setUi({ recoverError:"Pick a snapshot first." }); return; }
      if (!from || !to) { setUi({ recoverError:"Pick a from/to date first." }); return; }
      if (parseDateBasis(from) > parseDateBasis(to)) { setUi({ recoverError:"“From” date is after “To” date." }); return; }
      if (!dbApi || !dbApi.getBackupState) { setUi({ recoverError:"Not connected — can't compare right now." }); return; }
      setUi({ recoverLoading:true, recoverError:null, recoverPreview:null, recoverBackupId:id, recoverFrom:from, recoverTo:to });
      dbApi.getBackupState(id).then(function(backupState){
        if (!backupState || !Array.isArray(backupState.entries)) {
          setUi({ recoverLoading:false, recoverError:"Couldn't load that backup — it may have been removed." });
          return;
        }
        const inRange = function(e){
          const d = parseDateBasis(e.entryDate || dateOnlyStr(e.ts));
          return d >= parseDateBasis(from) && d <= parseDateBasis(to);
        };
        const currentIds = {};
        STATE.entries.forEach(function(e){ currentIds[e.id] = true; });
        const missingEntries = backupState.entries.filter(function(e){ return inRange(e) && !currentIds[e.id]; });
        const missingIds = {};
        missingEntries.forEach(function(e){ missingIds[e.id] = true; });
        const missingSerials = (Array.isArray(backupState.serials) ? backupState.serials : []).filter(function(s){
          return s.entryId && missingIds[s.entryId];
        });
        setUi({
          recoverLoading:false, recoverError:null,
          recoverPreview: { backupId:id, from:from, to:to, missingEntries:missingEntries, missingSerials:missingSerials }
        });
      }).catch(function(e){
        console.error("Shift Floor: recover preview failed", e);
        setUi({ recoverLoading:false, recoverError:"Couldn't load that backup — check connection and try again." });
      });
    },
    confirmRecoverMissingEntries: function(){
      const pv = ui.recoverPreview;
      if (!pv || !pv.missingEntries || !pv.missingEntries.length) return;
      // Purely additive — nothing already in STATE.entries/STATE.serials is touched, moved,
      // or removed, so anything added since the snapshot (e.g. today's entries) is unaffected.
      const currentIds = {};
      STATE.entries.forEach(function(e){ currentIds[e.id] = true; });
      const toAdd = pv.missingEntries.filter(function(e){ return !currentIds[e.id]; });
      STATE.entries = STATE.entries.concat(toAdd);
      const currentSerialIds = {};
      STATE.serials.forEach(function(s){ currentSerialIds[s.id] = true; });
      const serialsToAdd = (pv.missingSerials||[]).filter(function(s){ return !currentSerialIds[s.id]; });
      STATE.serials = STATE.serials.concat(serialsToAdd);
      migrateState();
      persist(false, "Added "+toAdd.length+" missing entr"+(toAdd.length===1?"y":"ies")+" back.", "Added locally — will sync.");
      setUi({ recoverPreview:null, recoverBackupId:null });
    },

    saveEntryEdit: function(id){
      const e = STATE.entries.find(function(x){ return x.id===id; });
      if (!e) return;
      const taskSelect = document.getElementById("editEntryTask-"+id);
      const madeInput = document.getElementById("editEntryMade-"+id);
      const faultsInput = document.getElementById("editEntryFaults-"+id);
      const dateInput = document.getElementById("editEntryDate-"+id);
      const made = clamp0(madeInput ? madeInput.value : e.made);
      // Undo tool: lets a manager reassign an entry to a different task — e.g. one that
      // was matched/approved to the wrong task from Review Jobs. Also moves any serials
      // scanned against this entry so they stay consistent with its new task. Recomputes
      // the faults cap against whichever task ends up selected, in case that task has a
      // different (or no) parts-per-unit.
      if (taskSelect && taskSelect.value && taskSelect.value !== e.taskId && findTask(taskSelect.value)) {
        const newTaskId = taskSelect.value;
        STATE.serials.forEach(function(s){ if (s.entryId === e.id) s.taskId = newTaskId; });
        e.taskId = newTaskId;
      }
      const task = findTask(e.taskId);
      const ppu = (task && task.partsPerUnit) || 1;
      const faults = clamp0(Math.min(clamp0(faultsInput ? faultsInput.value : e.faults), made*ppu));
      e.made = made; e.faults = faults;
      // Manager history correction (Fix 2): allow moving which day this entry is
      // attributed to — this is what all the week/month/CSV aggregation already
      // buckets by (see aggregateWeek/aggregateMonth, which read entry.entryDate,
      // never ts), so changing it here automatically re-buckets the entry everywhere.
      if (dateInput && dateInput.value && /^\d{4}-\d{2}-\d{2}$/.test(dateInput.value)) {
        const maxD = new Date(); maxD.setHours(0,0,0,0);

      persist(false, "Entry updated.");

    copySerials: function(){
      const curKey = weekKeyOf(new Date());
      const list = (ui.serialsShowAll ? STATE.serials.slice() : STATE.serials.filter(function(s){ return weekKeyOf(s.ts)===curKey; }))
        .sort(function(a,b){ return new Date(b.ts)-new Date(a.ts); });
      // Mirrors the on-screen date grouping (see serialPanelSection) so the copied/CSV
      // text is separated by day the same way, every group (including today) headed.
      const text = groupSerialsByDate(list).map(function(g){
        const serialsText = g.items.map(function(s){ return s.serial; }).join("\n");
        return serialGroupHeadingText(g.date, g.items.length)+"\n"+serialsText;
      }).join("\n\n");
      function done(){ showToast("Copied "+list.length+" serial number(s)."); }
      function fail(){
        try {
          const ta = document.createElement("textarea");
          ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          done();
        } catch(e){ showToast("Could not copy — select the list and copy manually."); }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(fail);
      } else { fail(); }
    },

      if (!raw) return;
      const needed = Math.max(0, (ui.efMade||0) - (ui.efFaults||0));
      const list = (ui.efSerialsList || []).slice();
      if (list.length >= needed) { showToast("Already have "+needed+" serial(s) for this batch."); return; }

      const fmtErr = validateSerialFormat(raw);
      if (fmtErr) { setUi({ efSerialError:{ value:raw, message:fmtErr } }); return; }

      const dup = STATE.serials.some(function(s){ return s.serial===raw; }) || list.indexOf(raw)>-1;
      if (dup) { setUi({ efSerialError:{ value:raw, message:"Already recorded — enter a different serial." } }); return; }

      const existingFault = (STATE.faultBoards||[]).find(function(b){ return b.serial===raw && b.status!=="passed"; });
      if (existingFault) {
        if (existingFault.status === "set_aside") {
          setUi({ efSerialError:{ value:raw, message:"This unit was set aside — check with a manager before using it." } });
          return;
        }
        // Same Fault Log cross-check as the worker flow (see addScannedSerial()), just
        // resolved right here with a confirm rather than a separate interstitial screen —
        // there's no manager identity ambiguity to preserve inside this modal.
        closeCameraScan();
        const mgrId = getMgrIdentity();
        const mgr = (STATE.managers||[]).find(function(m){ return m.id===mgrId; });
        existingFault.status = "passed";
        existingFault.history.push({ id:uid("fbh"), action:"confirmed_good", status:"passed", notes:"Confirmed good via Enter for a Worker", entryDate: todayDateOnly(), ts:new Date().toISOString(), by: mgr?mgr.name:mgrId });
        persist(false, "Board confirmed Good.", "Saved locally — will sync.");
        showToast("This serial was logged Faulty — confirmed Good.");
      }

      list.push(raw);
      setUi({ efSerialsList:list, efSerialError:null });
      const el = document.getElementById("efSerialInput");
      if (el) el.value = "";

    downloadWeeklySummary: function(){
      // Feature 5: download whichever week is selected in the picker (defaults to the
      // current week, matching prior always-current behavior).
      const curKey = ui.downloadWeekKey || weekKeyOf(new Date());
      const curStart = weekStartFor(curKey);
      const agg = aggregateWeek(curKey);
      const rows = [];
      rows.push(["Shift Floor Weekly Summary"]);
      rows.push(["Week", fmtRange(curStart)]);
      rows.push([]);
      rows.push(["Task Summary"]);
      rows.push(["Task","Made","Faults","Yield %","Fault Rate %"]);
      activeTasks().forEach(function(t){
        const a = agg[t.id];
        const made = a?a.made:0, faults = a?a.faults:0;
        const ppu = t.partsPerUnit || 1;
        rows.push([t.name, made, faults, fmtPct(yieldPct(made,faults,ppu)), fmtPct(faultPct(made,faults,ppu))]);
      });
      rows.push([]);
      rows.push(["Worker Summary"]);
      rows.push(["Worker","Task","Made","Faults","Yield %"]);
      const byWorker = buildWorkerTaskRows(function(e){ return weekKeyOf(e.entryDate)===curKey; });
      Object.keys(byWorker).forEach(function(wid){
        const w = byWorker[wid];
        const worker = findWorker(wid);
        Object.keys(w.tasks).forEach(function(tid){
          const t = findTask(tid);
          const tk = w.tasks[tid];
          const ppu = (t && t.partsPerUnit) || 1;
          rows.push([worker?worker.name:"Unknown", t?t.name:"(deleted)", tk.made, tk.faults, fmtPct(yieldPct(tk.made,tk.faults,ppu))]);
        });
        rows.push([(worker?worker.name:"Unknown")+" total", "", w.made, w.faults, fmtPct(yieldPct(w.made,w.faults))]);
      });
      const csv = rows.map(function(r){
        return r.map(function(cell){
          const s = String(cell==null?"":cell);
          return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
        }).join(",");
      }).join("\r\n");
      const csvWithBom = "﻿" + csv;
      const filename = "shift-floor-weekly-"+curKey+".csv";
      downloadCsv(filename, csvWithBom);
      showToast("Weekly summary downloaded.");
    },
    downloadMonthlySummary: function(){
      // Feature 5: download whichever month is selected in the picker (defaults to the
      // current month). isPartial is recomputed from the SELECTED month's own end date, so
      // it correctly stays true only for the current (not-yet-complete) month and never
      // fires for a fully-completed past month.
      const monthKey = ui.downloadMonthKey || monthKeyOf(new Date());
      const mStart = monthStartFor(monthKey+"-01");
      const mEnd = monthEndFor(monthKey+"-01");
      const isPartial = new Date() < mEnd;
      const agg = aggregateMonth(monthKey);
      const rows = [];
      rows.push(["Shift Floor Monthly Summary"]);
      rows.push(["Month", fmtMonthLabel(mStart)]);
      if (isPartial) { const today = new Date(); rows.push(["Note", "Partial month data through "+today.getFullYear()+"-"+pad2(today.getMonth()+1)+"-"+pad2(today.getDate())]); }
      rows.push([]);
      rows.push(["Task Summary"]);
      rows.push(["Task","Made","Faults","Yield %","Fault Rate %"]);
      activeTasks().forEach(function(t){
        const a = agg[t.id];
        const made = a?a.made:0, faults = a?a.faults:0;
        const ppu = t.partsPerUnit || 1;
        rows.push([t.name, made, faults, fmtPct(yieldPct(made,faults,ppu)), fmtPct(faultPct(made,faults,ppu))]);
      });
      rows.push([]);
      rows.push(["Worker Summary"]);
      rows.push(["Worker","Task","Made","Faults","Yield %"]);
      const byWorker = buildWorkerTaskRows(function(e){ return monthKeyOf(e.entryDate)===monthKey; });
      Object.keys(byWorker).forEach(function(wid){
        const w = byWorker[wid];
        const worker = findWorker(wid);
        Object.keys(w.tasks).forEach(function(tid){
          const t = findTask(tid);
          const tk = w.tasks[tid];
          const ppu = (t && t.partsPerUnit) || 1;
          rows.push([worker?worker.name:"Unknown", t?t.name:"(deleted)", tk.made, tk.faults, fmtPct(yieldPct(tk.made,tk.faults,ppu))]);
        });
        rows.push([(worker?worker.name:"Unknown")+" total", "", w.made, w.faults, fmtPct(yieldPct(w.made,w.faults))]);
      });
      const csv = rows.map(function(r){
        return r.map(function(cell){
          const s = String(cell==null?"":cell);
          return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
        }).join(",");
      }).join("\r\n");
      const csvWithBom = "﻿" + csv;
      const filename = "shift-floor-monthly-"+monthKey+(isPartial?"-partial":"")+".csv";
      downloadCsv(filename, csvWithBom);
      showToast("Monthly summary downloaded.");
    }
  };

  function downloadCsv(filename, csvWithBom){
    try {
      const blob = new Blob([csvWithBom], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    } catch(e){
      console.error("Shift Floor: CSV download failed", e);
    }
  }
  window.App = App;

  // Wait for the document to be fully parsed before starting. This guarantees the
  // Firebase bridge <script type="module"> above (which is always deferred by
  // browsers until after parsing completes) has already run and set up
  // window.ShiftFloorDBReady — otherwise init() can race ahead of it and wrongly
  // conclude Firebase is unavailable.
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
